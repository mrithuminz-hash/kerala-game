/* =========================
   LOGIN
========================= */

async function start(){

 playerName=$("name").value.trim();
 district=$("district").value;

 if(!playerName){
  $("status").textContent="Enter your name";
  return;
 }

 $("loading").style.display="flex";

 try{

  const r=await sb.from("players")
   .insert({
    name:playerName,
    district:district,
    score:0,
    room:"kerala-world"
   })
   .select()
   .single();

  if(r.error)throw r.error;

  playerId=r.data.id;

  localStorage.setItem("kerala_name",playerName);
  localStorage.setItem("kerala_district",district);

  await loadStats();

  $("login").style.display="none";
  $("hud").style.display="block";

  $("location").textContent=district;

/* =========================
   PLAYER STATS
========================= */

async function loadStats(){

 const r=await sb.from("player_stats")
  .select("*")
  .eq("id",playerId)
  .maybeSingle();

 if(r.error){
  console.log(r.error);
  return;
 }

 if(r.data){

  money=Number(r.data.money)||0;
  xp=Number(r.data.xp)||0;
  level=Number(r.data.level)||1;
  missionsCompleted=
   Number(r.data.missions_completed)||0;

 }else{

  const newStats={
   id:playerId,
   money:500,
   xp:0,
   level:1,
   missions_completed:0
  };

  const ins=await sb.from("player_stats")
   .insert(newStats);

  if(ins.error){
   console.log(ins.error);
  }

  money=500;
  xp=0;
  level=1;
  missionsCompleted=0;
 }

}

async function saveStats(){

 await sb.from("player_stats")
 .update({
  money:money,
  xp:xp,
  level:level,
  missions_completed:missionsCompleted
 })
 .eq("id",playerId);

}

function updateStatsUI(){

 $("money").textContent=money;
 $("xp").textContent=xp;
 $("level").textContent=level;

}

function addXP(amount){

 xp+=amount;

 const required=level*100;

 if(xp>=required){

  xp-=required;
  level++;

  showMissionMessage(
   "🎉 LEVEL UP! You reached Level "+level
  );

 }

 updateStatsUI();
 saveStats();

}

/* =========================
   ROAD
========================= */

function road(x,z,len,w,rot){

 const r=new THREE.Mesh(
  new THREE.PlaneGeometry(w,len),
  new THREE.MeshStandardMaterial({
   color:0x303030
  })
 );

 r.rotation.x=-Math.PI/2;
 r.rotation.z=rot;
 r.position.set(x,.03,z);

 scene.add(r);


 for(
  let i=-len/2;
  i<len/2;
  i+=18
 ){

  const l=new THREE.Mesh(
   new THREE.PlaneGeometry(1,8),
   new THREE.MeshBasicMaterial({
    color:0xffd84a
   })
  );

  l.rotation.x=-Math.PI/2;
  l.rotation.z=rot;

  if(rot===0)
   l.position.set(x,.04,z+i);
  else
   l.position.set(x+i,.04,z);

  scene.add(l);

 }

}

/* =========================
   TEXT SPRITE
========================= */

function textSprite(txt){

 const c=document.createElement("canvas");

 c.width=512;
 c.height=128;

 const x=c.getContext("2d");

 x.fillStyle="#fff";
 x.fillRect(0,0,512,128);

 x.fillStyle="#075b38";

 x.font="bold 48px Arial";

 x.textAlign="center";
 x.textBaseline="middle";

 x.fillText(
  txt,
  256,
  64
 );

 return new THREE.Sprite(
  new THREE.SpriteMaterial({
   map:new THREE.CanvasTexture(c)
  })
 );

}

/* =========================
   NPC CHECK
========================= */

function checkNPC(){

 if(!player)return;

 nearNPC=null;

 let closest=999;

 npcs.forEach(npc=>{

  if(npc.completed)return;

  const d=
   npc.mesh.position.distanceTo(
    player.position
   );

  if(d<10 && d<closest){

   closest=d;
   nearNPC=npc;

  }

 });

 if(
  nearNPC &&
  !activeMission
 ){

  $("missionButton").style.display="block";

  $("missionButton").textContent=
   "🎯 TALK TO "+nearNPC.name;

 }else{

  $("missionButton").style.display="none";

 }

}


/* =========================
   START MISSION
========================= */

function startMission(){

 if(!nearNPC || activeMission)return;

 activeMission=nearNPC;
 activeMission.active=true;

 $("missionButton").style.display="none";

 $("mission").style.display="block";

 $("mission").innerHTML=
  "🎯 <b>"+activeMission.name+
  "</b><br>Go to the green target<br>"+
  "Reward: ₹"+activeMission.reward+
  " + XP";

 showMissionMessage(
  "Mission started: "+
  activeMission.place
 );

}


/* =========================
   MISSION TARGET
========================= */

function checkActiveMission(){

 if(!activeMission)return;

 const target=new THREE.Vector3(
  activeMission.targetX,
  0,
  activeMission.targetZ
 );

 const d=player.position.distanceTo(target);

 if(d<10){

  completeMission();

 }

}


function completeMission(){

 const m=activeMission;

 money+=m.reward;

 missionsCompleted++;

 addXP(
  Math.floor(m.reward/2)
 );

 m.completed=true;
 m.active=false;

 activeMission=null;

 updateStatsUI();

 saveStats();

 $("mission").style.display="block";

 $("mission").innerHTML=
  "✅ <b>MISSION COMPLETE!</b><br>"+
  "💰 +₹"+m.reward+
  "<br>⭐ XP earned";

 setTimeout(()=>{

  if(!activeMission)
   $("mission").style.display="none";

 },5000);

}

   MISSION MESSAGE
========================= */

function showMissionMessage(message){

 $("mission").style.display="block";
 $("mission").innerHTML=message;

 setTimeout(()=>{

  if(!activeMission)
   $("mission").style.display="none";

 },4000);

}

  if(v.driver)return;

  const d=
   v.mesh.position.distanceTo(
    player.position
   );

  if(d<dist){

   dist=d;
   best=v;

  }

 });

 return dist<10?best:null;

}


function toggleVehicle(){

 if(currentVehicle){

  exitVehicle();
  return;

 }

 const v=nearestVehicle();

 if(v){

  currentVehicle=v;
  v.driver=playerId;

  player.visible=false;

  $("drive").classList.add("active");

  $("interact").textContent=
   "EXIT VEHICLE";

 }

}


function exitVehicle(){

 if(!currentVehicle)return;

 player.visible=true;

 player.position.copy(
  currentVehicle.mesh.position
 );

 player.position.x+=5;

 currentVehicle.driver=null;
 currentVehicle.speed=0;

 currentVehicle=null;

 $("drive").classList.remove("active");

 $("interact").textContent=
  "ENTER VEHICLE";

}


$("drive").onclick=toggleVehicle;
$("interact").onclick=toggleVehicle;
$("missionButton").onclick=startMission;


/* =========================
   MOVEMENT
========================= */

function updateMovement(dt){

 if(!player)return;

 if(currentVehicle){

  driveVehicle(dt);
  return;

 }


 let f=0,s=0;

 if(keys.w||keys.arrowup)f++;
 if(keys.s||keys.arrowdown)f--;

 if(keys.a||keys.arrowleft)s--;
 if(keys.d||keys.arrowright)s++;

 f+=joy.y;
 s+=joy.x;

 let len=Math.hypot(f,s);

 if(len>1){

  f/=len;
  s/=len;

 }

 const speed=
  running?17:9;

 player.position.x+=
  s*speed*dt;

 player.position.z-=
  f*speed*dt;


 if(len>.05){

  player.rotation.y=
   Math.atan2(s,-f);

 }


 velocity-=28*dt;

 player.position.y+=
  velocity*dt;


 if(player.position.y<=0){

  player.position.y=0;
  velocity=0;
  onGround=true;

 }

 boundPlayer();

 broadcast();

 checkNPC();

 checkActiveMission();

}


/* =========================
   VEHICLE DRIVING
========================= */

function driveVehicle(dt){

 const v=currentVehicle;

 let f=0,s=0;

 if(keys.w||keys.arrowup)f++;
 if(keys.s||keys.arrowdown)f--;

 if(keys.a||keys.arrowleft)s--;
 if(keys.d||keys.arrowright)s++;

 f+=joy.y;
 s+=joy.x;

 v.speed+=
  f*30*dt;

 v.speed*=.94;

 v.speed=
  Math.max(
   -15,
   Math.min(35,v.speed)
  );

 v.rotation-=
  s*v.speed*.012*dt;

 v.mesh.rotation.y=
  v.rotation;

 v.mesh.position.x+=
  Math.sin(v.rotation)*
  v.speed*dt;

 v.mesh.position.z+=
  Math.cos(v.rotation)*
  v.speed*dt;

 boundCar(v);

 broadcastVehicle(v);

}


function boundPlayer(){

 player.position.x=
  Math.max(
   -420,
   Math.min(
    420,
    player.position.x
   )
  );

 player.position.z=
  Math.max(
   -420,
   Math.min(
    420,
    player.position.z
   )
  );

}


function boundCar(v){

 v.mesh.position.x=
  Math.max(
   -420,
   Math.min(
    420,
    v.mesh.position.x
   )
  );

 v.mesh.position.z=
  Math.max(
   -420,
   Math.min(
    420,
    v.mesh.position.z
   )
  );

}


function jump(){

 if(
  onGround &&
  !currentVehicle
 ){

  velocity=11;
  onGround=false;

 }

}


/* =========================
   CONTROLS
========================= */

addEventListener(
 "keydown",
 e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.key==="Shift")
   running=true;

  if(e.key===" ")
   jump();

 }
);


addEventListener(
 "keyup",
 e=>{

  keys[e.key.toLowerCase()]=false;

  if(e.key==="Shift")
   running=false;

 }
);


$("run").onpointerdown=
 ()=>{
  running=true;
 };

$("run").onpointerup=
 ()=>{
  running=false;
 };

$("jump").onpointerdown=jump;


const base=$("joystick");
const stick=$("stick");

let active=false;


function joyMove(x,y){

 const r=
  base.getBoundingClientRect();

 let dx=
  x-(r.left+r.width/2);

 let dy=
  y-(r.top+r.height/2);

 const max=45;

 const d=
  Math.hypot(dx,dy);

 if(d>max){

  dx=dx/d*max;
  dy=dy/d*max;

 }

 stick.style.transform=
  `translate(${dx}px,${dy}px)`;

 joy.x=dx/max;
 joy.y=-dy/max;

}


base.onpointerdown=e=>{

 active=true;

 joyMove(
  e.clientX,
  e.clientY
 );

};


addEventListener(
 "pointermove",
 e=>{

  if(active)
   joyMove(
    e.clientX,
    e.clientY
   );

 }
);


addEventListener(
 "pointerup",
 ()=>{

  active=false;

  joy.x=0;
  joy.y=0;

  stick.style.transform=
   "translate(0,0)";

 }
);


/* =========================
   MULTIPLAYER
========================= */

async function multiplayer(){

 channel=sb.channel(
  "kerala-world-main",
  {
   config:{
    presence:{
     key:playerId
    },
    broadcast:{
     self:false
    }
   }
  }
 );


 channel
 .on(
  "presence",
  {event:"sync"},
  presenceSync
 )

 .on(
  "presence",
  {event:"join"},
  presenceSync
 )

 .on(
  "presence",
  {event:"leave"},
  presenceSync
 )


 .on(
  "broadcast",
  {event:"position"},
  p=>{

   const d=p.payload;

   if(
    !d||
    d.id===playerId
   )return;

   const r=makeRemote(d);

   r.position.set(
    d.x,
    d.y,
    d.z
   );

   r.rotation.y=
    d.rotation||0;

  }
 )


 .on(
  "broadcast",
  {event:"vehicle"},
  p=>{

   const d=p.payload;

   if(
    !d||
    d.id===playerId
   )return;

   const v=
    vehicles[d.index];

   if(v){

    v.mesh.position.set(
     d.x,
     0,
     d.z
    );

    v.mesh.rotation.y=
     d.rotation;

   }

  }
 )


 .on(
  "broadcast",
  {event:"chat"},
  p=>{

   if(p.payload){

    addChat(
     p.payload.name,
     p.payload.message
    );

   }

  }
 );


 channel.subscribe(
  async status=>{

   if(status==="SUBSCRIBED"){

    await channel.track({

     id:playerId,
     name:playerName,

     x:player.position.x,
     y:player.position.y,
     z:player.position.z,

     rotation:
      player.rotation.y

    });

   }

  }
 );

}


/* =========================
   PRESENCE
========================= */

function presenceSync(){

 const state=
  channel.presenceState();

 const active={};

 Object.keys(state)
 .forEach(id=>{

  if(id===playerId)return;

  const d=
   state[id][0];

  active[id]=true;

  makeRemote(d);

 });


 Object.keys(remotes)
 .forEach(id=>{

  if(!active[id]){

   scene.remove(
    remotes[id]
   );

   delete remotes[id];

  }

 });


 $("online").textContent=
  Object.keys(remotes).length+1;

}


/* =========================
   REMOTE PLAYER
========================= */

function makeRemote(d){

 if(remotes[d.id])
  return remotes[d.id];


 const g=new THREE.Group();


 const b=new THREE.Mesh(
  new THREE.CapsuleGeometry(
   1.25,
   2.8,
   5,
   10
  ),
  new THREE.MeshStandardMaterial({
   color:0x9b3d8b
  })
 );

 b.position.y=2.5;

 g.add(b);


 const h=new THREE.Mesh(
  new THREE.SphereGeometry(
   1.15,
   16,
   16
  ),
  new THREE.MeshStandardMaterial({
   color:0xb87952
  })
 );

 h.position.y=5;

 g.add(h);


 const l=textSprite(
  d.name||"Player"
 );

 l.position.y=7;

 l.scale.set(
  7,
  1.8,
  1
 );

 g.add(l);


 g.position.set(
  d.x||0,
  d.y||0,
  d.z||0
 );

 scene.add(g);

 remotes[d.id]=g;

 return g;

}


/* =========================
   BROADCAST PLAYER
========================= */

function broadcast(){

 if(!channel||!player)
  return;

 const now=
  performance.now();

 if(
  now-lastSend<70
 )return;

 lastSend=now;


 channel.send({

  type:"broadcast",

  event:"position",

  payload:{

   id:playerId,
   name:playerName,

   x:player.position.x,
   y:player.position.y,
   z:player.position.z,

   rotation:
    player.rotation.y

  }

 });

}


/* =========================
   BROADCAST VEHICLE
========================= */

function broadcastVehicle(v){

 if(!channel)return;

 channel.send({

  type:"broadcast",

  event:"vehicle",

  payload:{

   id:playerId,

   index:
    vehicles.indexOf(v),

   x:v.mesh.position.x,
   z:v.mesh.position.z,

   rotation:
    v.mesh.rotation.y

  }

 });

}


/* =========================
   CHAT
========================= */

$("chatForm").onsubmit=
 async e=>{

  e.preventDefault();

  const input=
   $("chatInput");

  const message=
   input.value.trim();

  if(!message)return;

  addChat(
   playerName,
   message
  );


  if(channel){

   await channel.send({

    type:"broadcast",

    event:"chat",

    payload:{
     name:playerName,
     message:message
    }

   });

  }

  input.value="";

 };


function addChat(
 name,
 message
){

 const d=
  document.createElement("div");

 d.className="msg";

 d.textContent=
  name+": "+message;

 $("chat").appendChild(d);


 while(
  $("chat").children.length>7
 ){

  $("chat")
   .firstChild
   .remove();

 }


 setTimeout(
  ()=>{
   if(d.parentNode)
    d.remove();
  },
  10000
 );

}


/* =========================
   CAMERA
========================= */

function cameraUpdate(){

 if(!player)return;

 const target=
  currentVehicle?
  currentVehicle.mesh.position.clone():
  player.position.clone();

 target.y+=4;


 const offset=
  new THREE.Vector3(
   0,
   8,
   16
  );


 if(currentVehicle){

  offset.applyAxisAngle(
   new THREE.Vector3(
    0,1,0
   ),
   currentVehicle.rotation
  );

 }else{

  offset.applyAxisAngle(
   new THREE.Vector3(
    0,1,0
   ),
   player.rotation.y
  );

 }


 const desired=
  target.clone().add(offset);


 camera.position.lerp(
  desired,
  .12
 );

 camera.lookAt(target);

}


/* =========================
   GAME LOOP
========================= */

function animate(){

 requestAnimationFrame(
  animate
 );

 const dt=
  Math.min(
   clock.getDelta(),
   .05
  );

 updateMovement(dt);

 nearVehicle=
  nearestVehicle();


 if(
  nearVehicle &&
  !currentVehicle
 ){

  $("interact").style.display=
   "block";

  $("interact").textContent=
   "🚗 ENTER VEHICLE";

 }else if(!currentVehicle){

  $("interact").style.display=
   "none";

 }


 cameraUpdate();

 renderer.render(
  scene,
  camera
 );

}


/* =========================
   RESIZE
========================= */

addEventListener(
 "resize",
 ()=>{

  if(!camera)return;

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);


/* =========================
   REMEMBER LOGIN
========================= */

$("name").value=
 localStorage.getItem(
  "kerala_name"
 )||"";


$("district").value=
 localStorage.getItem(
  "kerala_district"
 )||"Ernakulam";

</script>
