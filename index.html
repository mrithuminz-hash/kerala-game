<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Kerala Open World</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  touch-action:none;
}
#game{position:fixed;inset:0}
canvas{display:block}

#login{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#063b24,#075e38,#10251d);
}
.loginBox{
  width:min(92%,380px);
  padding:28px;
  border-radius:20px;
  background:rgba(0,0,0,.72);
  box-shadow:0 10px 40px rgba(0,0,0,.5);
  text-align:center;
}
.loginBox h1{
  margin:0 0 8px;
  font-size:30px;
}
.loginBox p{
  color:#bbb;
  margin:0 0 20px;
}
input,select,button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  margin-top:10px;
  font-size:16px;
}
button{
  background:#19c37d;
  color:#fff;
  font-weight:bold;
}
button:active{transform:scale(.97)}
#loginMsg{margin-top:12px;color:#ffcc66}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  z-index:10;
  min-width:175px;
  padding:10px 12px;
  border-radius:14px;
  background:rgba(0,0,0,.62);
  font-size:13px;
  line-height:1.65;
}
.hudTitle{
  font-weight:bold;
  font-size:15px;
  margin-bottom:3px;
}
#wanted{
  color:#ffd43b;
}

#mission{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(82%,380px);
  z-index:11;
  padding:10px 14px;
  border-radius:14px;
  background:rgba(0,0,0,.68);
  text-align:center;
  display:none;
}
#missionTitle{
  font-weight:bold;
  color:#61ff9a;
}
#missionText{
  font-size:13px;
  margin-top:3px;
}

#chat{
  position:fixed;
  left:10px;
  bottom:110px;
  z-index:12;
  width:min(75%,330px);
  pointer-events:none;
}
.chatLine{
  background:rgba(0,0,0,.55);
  padding:5px 8px;
  border-radius:7px;
  margin-top:4px;
  font-size:12px;
}

#chatInput{
  position:fixed;
  left:50%;
  bottom:65px;
  transform:translateX(-50%);
  width:60%;
  max-width:320px;
  z-index:20;
  display:none;
}

#joystick{
  position:fixed;
  left:22px;
  bottom:25px;
  width:120px;
  height:120px;
  z-index:20;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.2);
}
#stick{
  position:absolute;
  width:54px;
  height:54px;
  left:31px;
  top:31px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
}

.controls{
  position:fixed;
  right:18px;
  bottom:22px;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:9px;
  align-items:flex-end;
}
.ctrl{
  width:68px;
  height:48px;
  border-radius:15px;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  font-size:12px;
  font-weight:bold;
}
.ctrl.green{background:rgba(0,150,80,.72)}
.ctrl.red{background:rgba(190,30,30,.75)}
.ctrl.yellow{background:rgba(180,130,0,.75)}

#talkBtn{
  position:fixed;
  left:50%;
  bottom:145px;
  transform:translateX(-50%);
  width:170px;
  z-index:22;
  display:none;
  background:#157efb;
}

#missionBtn{
  position:fixed;
  left:50%;
  bottom:205px;
  transform:translateX(-50%);
  width:200px;
  z-index:22;
  display:none;
  background:#19c37d;
}

#policeAlert{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  display:none;
  padding:10px 18px;
  border-radius:14px;
  background:#a40000;
  color:white;
  font-weight:bold;
  box-shadow:0 0 20px rgba(255,0,0,.45);
  animation:pulse .8s infinite alternate;
}
@keyframes pulse{
  from{transform:translateX(-50%) scale(1)}
  to{transform:translateX(-50%) scale(1.05)}
}

#loading{
  position:fixed;
  inset:0;
  z-index:40;
  background:#111;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="login">
  <div class="loginBox">
    <h1>🌴 Kerala Open World</h1>
    <p>Enter the world</p>

    <input id="playerName" placeholder="Your name" maxlength="18">

    <select id="district">
      <option value="Ernakulam">Ernakulam</option>
      <option value="Kozhikode">Kozhikode</option>
      <option value="Malappuram">Malappuram</option>
      <option value="Thrissur">Thrissur</option>
      <option value="Kollam">Kollam</option>
      <option value="Thiruvananthapuram">Thiruvananthapuram</option>
      <option value="Kannur">Kannur</option>
      <option value="Alappuzha">Alappuzha</option>
      <option value="Palakkad">Palakkad</option>
      <option value="Kottayam">Kottayam</option>
      <option value="Idukki">Idukki</option>
      <option value="Wayanad">Wayanad</option>
      <option value="Pathanamthitta">Pathanamthitta</option>
      <option value="Kasaragod">Kasaragod</option>
    </select>

    <button onclick="startGame()">ENTER WORLD</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="loading">Loading Kerala...</div>

<div id="hud">
  <div class="hudTitle">🌴 KERALA WORLD</div>
  👤 <span id="hudName">Player</span><br>
  🌐 Online: <span id="online">1</span><br>
  💰 ₹<span id="money">500</span><br>
  ⭐ XP: <span id="xp">0</span><br>
  🏆 Level: <span id="level">1</span><br>
  🚨 Wanted: <span id="wanted">0</span><br>
  💸 Fines: <span id="fines">0</span>
</div>

<div id="mission">
  <div id="missionTitle">MISSION</div>
  <div id="missionText"></div>
</div>

<div id="policeAlert">🚔 POLICE ARE CHASING YOU!</div>

<div id="chat"></div>
<input id="chatInput" placeholder="Type message...">

<button id="talkBtn" onclick="talkToNPC()">TALK</button>
<button id="missionBtn" onclick="startCurrentMission()">START MISSION</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<div class="controls">
  <button class="ctrl green" id="runBtn">RUN</button>
  <button class="ctrl" id="jumpBtn">JUMP</button>
  <button class="ctrl yellow" id="carBtn">CAR</button>
  <button class="ctrl" id="chatBtn">CHAT</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://putlvisgkmjtiqmxkdda.supabase.co";
const SUPABASE_KEY="sb_publishable_P_a8u-8fi3GPBplKJeKNog_lp0ElC_S";

const sb=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let playerId=null;
let playerName="";
let district="";

let money=500;
let xp=0;
let level=1;
let missionsCompleted=0;
let wanted=0;
let finesPaid=0;

let scene,camera,renderer;
let clock;
let player;
let playerMesh;

let keys={};
let joyX=0;
let joyY=0;
let running=false;

let remotePlayers={};
let channel=null;

let cars=[];
let currentCar=null;
let inCar=false;

let npcs=[];
let currentNPC=null;

let policeUnits=[];
let policeSpawned=false;

let activeMission=null;
let missionMarker=null;

const worldSize=260;

const $=id=>document.getElementById(id);


/* =========================
   LOGIN
========================= */

async function startGame(){

  const name=$("playerName").value.trim();

  if(!name){
    $("loginMsg").textContent="Enter your name";
    return;
  }

  playerName=name;
  district=$("district").value;

  $("login").style.display="none";
  $("loading").style.display="flex";

  try{

    const r=await sb
      .from("players")
      .insert({
        name:playerName,
        district:district,
        score:0,
        room:"kerala-world"
      })
      .select()
      .single();

    if(r.error){
      console.log(r.error);
      playerId=crypto.randomUUID();
    }else{
      playerId=r.data.id;
    }

    await loadStats();

    initThree();
    createWorld();
    createPlayer();
    createNPCs();
    createCars();
    createPolice();

    await connectMultiplayer();

    updateHUD();

    $("loading").style.display="none";

    animate();

  }catch(e){

    console.log(e);

    $("loading").style.display="none";
    $("login").style.display="flex";
    $("loginMsg").textContent="Connection error";

  }
}


/* =========================
   STATS
========================= */

async function loadStats(){

  const r=await sb
    .from("player_stats")
    .select("*")
    .eq("id",playerId)
    .maybeSingle();

  if(r.error){
    console.log(r.error);
    return;
  }

  if(r.data){

    money=Number(r.data.money)||0;
    xp=Number(r.data.xp)||0;
    level=Number(r.data.level)||1;
    missionsCompleted=Number(r.data.missions_completed)||0;
    wanted=Number(r.data.wanted)||0;
    finesPaid=Number(r.data.fines_paid)||0;

  }else{

    await sb.from("player_stats").insert({
      id:playerId,
      money:500,
      xp:0,
      level:1,
      missions_completed:0,
      wanted:0,
      fines_paid:0
    });

    money=500;
    xp=0;
    level=1;
    missionsCompleted=0;
    wanted=0;
    finesPaid=0;
  }
}

async function saveStats(){

  await sb
    .from("player_stats")
    .update({
      money:money,
      xp:xp,
      level:level,
      missions_completed:missionsCompleted,
      wanted:wanted,
      fines_paid:finesPaid
    })
    .eq("id",playerId);
}


/* =========================
   THREE
========================= */

function initThree(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x86c9ee);

  scene.fog=new THREE.Fog(
    0x86c9ee,
    120,
    340
  );

  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    600
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled=true;

  $("game").appendChild(renderer.domElement);

  clock=new THREE.Clock();

  const hemi=new THREE.HemisphereLight(
    0xbfeaff,
    0x426044,
    2
  );

  scene.add(hemi);

  const sun=new THREE.DirectionalLight(
    0xffffff,
    2.5
  );

  sun.position.set(
    100,
    180,
    80
  );

  sun.castShadow=true;

  scene.add(sun);

  addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}


/* =========================
   WORLD
========================= */

function createWorld(){

  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(
      worldSize,
      worldSize
    ),
    new THREE.MeshLambertMaterial({
      color:0x459447
    })
  );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;
  scene.add(ground);

  createRoad(
    0,0,
    worldSize,
    14,
    0
  );

  createRoad(
    0,0,
    worldSize,
    12,
    Math.PI/2
  );

  createRiver();

  for(let i=0;i<30;i++){

    const x=(Math.random()-.5)*220;
    const z=(Math.random()-.5)*220;

    if(Math.abs(x)<14 || Math.abs(z)<14) continue;

    createHouse(x,z);
  }

  for(let i=0;i<35;i++){

    const x=(Math.random()-.5)*230;
    const z=(Math.random()-.5)*230;

    createPalm(x,z);
  }

  createShop(35,18,"TEA SHOP");
  createShop(-35,-18,"KERALA STORE");
  createShop(55,-40,"HOTEL");

  createTemple(-65,55);

  createStreetLights();
}


function createRoad(x,z,length,width,rotation){

  const road=new THREE.Mesh(
    new THREE.BoxGeometry(
      length,
      .12,
      width
    ),
    new THREE.MeshLambertMaterial({
      color:0x333333
    })
  );

  road.position.set(x,.06,z);
  road.rotation.y=rotation;

  scene.add(road);

  for(let i=-length/2;i<length/2;i+=12){

    const line=new THREE.Mesh(
      new THREE.BoxGeometry(
        5,.14,.35
      ),
      new THREE.MeshBasicMaterial({
        color:0xffdf4d
      })
    );

    if(rotation===0){
      line.position.set(
        x+i,
        .14,
        z
      );
    }else{
      line.position.set(
        x,
        .14,
        z+i
      );
    }

    scene.add(line);
  }
}


function createRiver(){

  const river=new THREE.Mesh(
    new THREE.PlaneGeometry(
      220,
      25
    ),
    new THREE.MeshLambertMaterial({
      color:0x238bd0,
      transparent:true,
      opacity:.8
    })
  );

  river.rotation.x=-Math.PI/2;
  river.position.set(0,.08,95);

  scene.add(river);
}


function createHouse(x,z){

  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(
      10,
      6,
      8
    ),
    new THREE.MeshLambertMaterial({
      color:0xe9d7b4
    })
  );

  body.position.y=3;
  body.castShadow=true;

  group.add(body);

  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(
      7,
      4,
      4
    ),
    new THREE.MeshLambertMaterial({
      color:0x9c3b2f
    })
  );

  roof.position.y=8;
  roof.rotation.y=Math.PI/4;

  group.add(roof);

  group.position.set(x,0,z);

  scene.add(group);
}


function createPalm(x,z){

  const group=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .35,.55,7,8
    ),
    new THREE.MeshLambertMaterial({
      color:0x704b2a
    })
  );

  trunk.position.y=3.5;

  group.add(trunk);

  for(let i=0;i<7;i++){

    const leaf=new THREE.Mesh(
      new THREE.BoxGeometry(
        .35,5,.7
      ),
      new THREE.MeshLambertMaterial({
        color:0x18752b
      })
    );

    leaf.position.y=7;

    leaf.rotation.z=.5;
    leaf.rotation.y=i*Math.PI*2/7;

    group.add(leaf);
  }

  group.position.set(x,0,z);

  scene.add(group);
}


function createShop(x,z,text){

  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(
      12,7,9
    ),
    new THREE.MeshLambertMaterial({
      color:0xd9d1ad
    })
  );

  body.position.y=3.5;
  group.add(body);

  const signCanvas=document.createElement("canvas");
  signCanvas.width=512;
  signCanvas.height=128;

  const ctx=signCanvas.getContext("2d");

  ctx.fillStyle="#063b24";
  ctx.fillRect(0,0,512,128);

  ctx.fillStyle="#ffffff";
  ctx.font="bold 45px Arial";
  ctx.textAlign="center";
  ctx.fillText(text,256,82);

  const texture=new THREE.CanvasTexture(
    signCanvas
  );

  const sign=new THREE.Mesh(
    new THREE.PlaneGeometry(
      10,2.5
    ),
    new THREE.MeshBasicMaterial({
      map:texture
    })
  );

  sign.position.set(0,7,4.55);

  group.add(sign);

  group.position.set(x,0,z);

  scene.add(group);
}


function createTemple(x,z){

  const group=new THREE.Group();

  const base=new THREE.Mesh(
    new THREE.BoxGeometry(
      14,6,12
    ),
    new THREE.MeshLambertMaterial({
      color:0xf0c75e
    })
  );

  base.position.y=3;
  group.add(base);

  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(
      9,7,4
    ),
    new THREE.MeshLambertMaterial({
      color:0xb52c1f
    })
  );

  roof.position.y=9;

  roof.rotation.y=Math.PI/4;

  group.add(roof);

  group.position.set(x,0,z);

  scene.add(group);
}


function createStreetLights(){

  for(let i=-100;i<=100;i+=30){

    const pole=new THREE.Mesh(
      new THREE.CylinderGeometry(
        .15,.2,7,8
      ),
      new THREE.MeshLambertMaterial({
        color:0x555555
      })
    );

    pole.position.set(
      i,
      3.5,
      9
    );

    scene.add(pole);

    const lamp=new THREE.Mesh(
      new THREE.SphereGeometry(
        .45,8,8
      ),
      new THREE.MeshBasicMaterial({
        color:0xffffaa
      })
    );

    lamp.position.set(
      i,
      7,
      9
    );

    scene.add(lamp);
  }
}


/* =========================
   PLAYER
========================= */

function createPlayer(){

  player={
    x:0,
    y:0,
    z:35,
    rot:0,
    vy:0,
    onGround:true
  };

  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .65,.8,1.8,10
    ),
    new THREE.MeshLambertMaterial({
      color:0x1769aa
    })
  );

  body.position.y=1.5;
  body.castShadow=true;

  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(
      .65,16,16
    ),
    new THREE.MeshLambertMaterial({
      color:0xb8794c
    })
  );

  head.position.y=2.8;

  group.add(head);

  group.position.set(
    player.x,
    0,
    player.z
  );

  playerMesh=group;

  scene.add(group);
}


/* =========================
   NPC
========================= */

function createNPCs(){

  createNPC(
    "Rajan",
    "Tea Shop",
    35,
    70,
    100
  );

  createNPC(
    "Anu",
    "Kerala Store",
    -40,

    200
  );

  createNPC(
    "Shafi",
    "Hotel",

  );

function createNPC(name,job,x,z,reward){

  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .6,.7,1.8,10
    ),
    new THREE.MeshLambertMaterial({
      color:Math.random()*0xffffff
    })
  );

  body.position.y=1.5;
  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(
      .6,12,12
    ),
    new THREE.MeshLambertMaterial({
      color:0xb8794c
    })
  );

  head.position.y=2.8;
  group.add(head);

  group.position.set(x,0,z);

  scene.add(group);

  npcs.push({
    name,
    job,
    x,
    z,
    reward,
    mesh:group
  });
}


/* =========================
   CARS
========================= */

function createCars(){

  createCar(10,5,0,false);
  createCar(-18,5,Math.PI,false);
  createCar(35,-8,Math.PI/2,false);
  createCar(-40,18,Math.PI/2,false);
}


function createCar(x,z,rot,isPolice){

  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(
      5.2,1.2,2.5
    ),
    new THREE.MeshLambertMaterial({
      color:isPolice?0xffffff:randomCarColor()
    })
  );

  body.position.y=1.2;
  body.castShadow=true;
  group.add(body);

  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(
      2.8,1,2
    ),
    new THREE.MeshLambertMaterial({
      color:isPolice?0xeeeeee:0x222222
    })
  );

  roof.position.y=2;

  group.add(roof);

  for(const sx of [-1.8,1.8]){
    for(const sz of [-1.1,1.1]){

      const wheel=new THREE.Mesh(
        new THREE.CylinderGeometry(
          .45,.45,.35,12
        ),
        new THREE.MeshLambertMaterial({
          color:0x111111
        })
      );

      wheel.rotation.z=Math.PI/2;

      wheel.position.set(
        sx,
        .55,
        sz
      );

      group.add(wheel);
    }
  }

  if(isPolice){

    const light1=new THREE.Mesh(
      new THREE.BoxGeometry(
        .8,.25,.5
      ),
      new THREE.MeshBasicMaterial({
        color:0xff2222
      })
    );

    light1.position.set(-.45,2.6,0);
    group.add(light1);

    const light2=new THREE.Mesh(
      new THREE.BoxGeometry(
        .8,.25,.5
      ),
      new THREE.MeshBasicMaterial({
        color:0x2255ff
      })
    );

    light2.position.set(.45,2.6,0);
    group.add(light2);
  }

  group.position.set(x,0,z);
  group.rotation.y=rot;

  scene.add(group);

  const car={
    mesh:group,
    x,
    z,
    rot,
    speed:0,
    police:!!isPolice,
    occupied:false
  };

  cars.push(car);

  return car;
}


function randomCarColor(){

  const colors=[
    0xd62828,
    0x1565c0,
    0xf9c74f,
    0xeeeeee,
    0x222222,
    0x00897b
  ];

  return colors[
    Math.floor(Math.random()*colors.length)
  ];
}


/* =========================
   POLICE
========================= */

function createPolice(){

  const locations=[
    [90,90],
    [-90,40],
    [70,-80]
  ];

  locations.forEach(p=>{

    const car=createCar(
      p[0],
      p[1],
      Math.random()*Math.PI*2,
      true
    );

    policeUnits.push({
      car,
      speed:7+Math.random()*2,
      active:false,
      caughtDistance:5.5
    });
  });
}


/* =========================
   MOVEMENT
========================= */

function updateMovement(dt){

  if(!player || inCar) return;

  let dx=joyX;
  let dz=joyY;

  if(keys["w"]||keys["ArrowUp"]) dz-=1;
  if(keys["s"]||keys["ArrowDown"]) dz+=1;
  if(keys["a"]||keys["ArrowLeft"]) dx-=1;
  if(keys["d"]||keys["ArrowRight"]) dx+=1;

  const len=Math.hypot(dx,dz);

  if(len>0){

    dx/=len;
    dz/=len;

    const speed=running?13:7;

    player.x+=dx*speed*dt;
    player.z+=dz*speed*dt;

    player.rot=Math.atan2(dx,dz);

    playerMesh.rotation.y=player.rot;
  }

  if(player.y>0 || !player.onGround){

    player.vy-=20*dt;
    player.y+=player.vy*dt;

    if(player.y<=0){

      player.y=0;
      player.vy=0;
      player.onGround=true;
    }
  }

  player.x=THREE.MathUtils.clamp(
    player.x,-125,125
  );

  player.z=THREE.MathUtils.clamp(
    player.z,-125,125
  );

  playerMesh.position.set(
    player.x,
    player.y,
    player.z
  );

  checkNPC();

  checkMission();

  broadcastPosition();
}


function jump(){

  if(!player || inCar) return;

  if(player.onGround){

    player.vy=9;
    player.onGround=false;
  }
}


function toggleRun(state){

  running=state;
}


/* =========================
   CAMERA
========================= */

function updateCamera(){

  if(!player) return;

  let targetX=player.x;
  let targetZ=player.z;

  if(inCar && currentCar){

    targetX=currentCar.mesh.position.x;
    targetZ=currentCar.mesh.position.z;
  }

  const desired=new THREE.Vector3(
    targetX,
    14,
    targetZ+18
  );

  camera.position.lerp(
    desired,
    .08
  );

  camera.lookAt(
    targetX,
    1.5,
    targetZ
  );
}


/* =========================
   CAR
========================= */

function toggleVehicle(){

  if(!player) return;

  if(inCar){

    exitCar();
    return;
  }

  let nearest=null;
  let dist=999;

  cars.forEach(car=>{

    if(car.police) return;

    const dx=car.mesh.position.x-player.x;
    const dz=car.mesh.position.z-player.z;

    const d=Math.hypot(dx,dz);

    if(d<dist && d<6){

      nearest=car;
      dist=d;
    }
  });

  if(nearest){

    enterCar(nearest);
  }
}


function enterCar(car){

  currentCar=car;
  inCar=true;
  car.occupied=true;

  addWanted(1);

  $("carBtn").textContent="EXIT";

  addChat(
    "SYSTEM",
    "You entered a vehicle. 🚗"
  );
}


function exitCar(){

  if(!currentCar) return;

  player.x=
    currentCar.mesh.position.x+3;

  player.z=
    currentCar.mesh.position.z+3;

  currentCar.occupied=false;

  currentCar=null;
  inCar=false;

  $("carBtn").textContent="CAR";
}


function updateCar(dt){

  if(!inCar || !currentCar) return;

  let throttle=0;
  let steer=0;

  if(keys["w"]||keys["ArrowUp"]) throttle=1;
  if(keys["s"]||keys["ArrowDown"]) throttle=-1;

  if(keys["a"]||keys["ArrowLeft"]) steer=1;
  if(keys["d"]||keys["ArrowRight"]) steer=-1;

  const maxSpeed=running?28:20;

  currentCar.speed+=throttle*25*dt;

  currentCar.speed*=Math.pow(.12,dt);

  currentCar.speed=THREE.MathUtils.clamp(
    currentCar.speed,
    -10,
    maxSpeed
  );

  currentCar.mesh.rotation.y+=
    steer*.8*dt*
    (Math.abs(currentCar.speed)/10);

  const dir=new THREE.Vector3(
    Math.sin(currentCar.mesh.rotation.y),
    0,
    Math.cos(currentCar.mesh.rotation.y)
  );

  currentCar.mesh.position.addScaledVector(
    dir,
    currentCar.speed*dt
  );

  currentCar.mesh.position.x=
    THREE.MathUtils.clamp(
      currentCar.mesh.position.x,
      -125,125
    );

  currentCar.mesh.position.z=
    THREE.MathUtils.clamp(
      currentCar.mesh.position.z,
      -125,125
    );

  player.x=currentCar.mesh.position.x;
  player.z=currentCar.mesh.position.z;

  broadcastPosition();
}


/* =========================
   NPC INTERACTION
========================= */

function checkNPC(){

  currentNPC=null;

  let nearest=999;

  npcs.forEach(npc=>{

    const d=Math.hypot(
      npc.x-player.x,
      npc.z-player.z
    );

    if(d<nearest && d<8){

      nearest=d;
      currentNPC=npc;
    }
  });

  if(currentNPC && !activeMission){

    $("talkBtn").style.display="block";

  }else{

    $("talkBtn").style.display="none";
  }
}


function talkToNPC(){

  if(!currentNPC) return;

  $("talkBtn").style.display="none";

  $("missionBtn").style.display="block";

  $("missionTitle").textContent=
    currentNPC.name+" • "+currentNPC.job;

  $("missionText").textContent=
    "Mission reward ₹"+currentNPC.reward;

  $("mission").style.display="block";
}


function startCurrentMission(){

  if(!currentNPC) return;

  const targetMap={
    Rajan:{x:40,z:70},
    Anu:{x:-40,z:-70},
    Shafi:{x:80,z:70}
  };

  const target=targetMap[currentNPC.name];

  activeMission={
    npc:currentNPC,
    targetX:target.x,
    targetZ:target.z,
    reward:currentNPC.reward
  };

  createMissionMarker(
    target.x,
    target.z
  );

  $("missionBtn").style.display="none";

  $("missionTitle").textContent=
    "📍 "+currentNPC.name+" Mission";

  updateMissionText();
}


function createMissionMarker(x,z){

  if(missionMarker){

    scene.remove(missionMarker);
  }

  missionMarker=new THREE.Mesh(
    new THREE.CylinderGeometry(
      3,3,.25,32
    ),
    new THREE.MeshBasicMaterial({
      color:0x20ff72,
      transparent:true,
      opacity:.65
    })
  );

  missionMarker.position.set(
    x,
    .2,
    z
  );

  scene.add(missionMarker);
}


function checkMission(){

  if(!activeMission) return;

  const d=Math.hypot(
    activeMission.targetX-player.x,
    activeMission.targetZ-player.z
  );

  if(d<7){

    completeMission();
    return;
  }

  updateMissionText();
}


function updateMissionText(){

  if(!activeMission) return;

  const d=Math.round(
    Math.hypot(
      activeMission.targetX-player.x,
      activeMission.targetZ-player.z
    )
  );

  $("mission").style.display="block";

  $("missionText").textContent=
    "Go to destination • "+d+"m away • ₹"+
    activeMission.reward;
}


async function completeMission(){

  const reward=activeMission.reward;

  money+=reward;
  missionsCompleted++;

  addXP(
    Math.floor(reward/2)
  );

  addChat(
    "MISSION",
    "Completed! +₹"+reward
  );

  activeMission=null;

  if(missionMarker){

    scene.remove(missionMarker);
    missionMarker=null;
  }

  $("mission").style.display="none";

  updateHUD();

  await saveStats();
}


/* =========================
   XP
========================= */

async function addXP(amount){

  xp+=amount;

  let required=level*100;

  while(xp>=required){

    xp-=required;
    level++;

    addChat(
      "LEVEL",
      "🎉 Level "+level+" reached!"
    );

    required=level*100;
  }

  updateHUD();

  await saveStats();
}


/* =========================
   WANTED
========================= */

async function addWanted(amount){

  wanted+=amount;

  wanted=THREE.MathUtils.clamp(
    wanted,
    0,
    5
  );

  if(wanted>0){

    $("policeAlert").style.display="block";
  }

  updateHUD();

  await saveStats();
}


async function reduceWanted(){

  if(wanted<=0) return;

  wanted--;

  updateHUD();

  if(wanted===0){

    $("policeAlert").style.display="none";

    addChat(
      "POLICE",
      "You escaped the police."
    );
  }

  await saveStats();
}


/* =========================
   POLICE AI
========================= */

function updatePolice(dt){

  if(!player) return;

  policeUnits.forEach(unit=>{

    const car=unit.car;

    if(wanted<=0){

      unit.active=false;
      return;
    }

    unit.active=true;

    const dx=player.x-car.mesh.position.x;
    const dz=player.z-car.mesh.position.z;

    const dist=Math.hypot(dx,dz);

    if(dist<unit.caughtDistance){

      caughtByPolice();
      return;
    }

    const angle=Math.atan2(dx,dz);

    car.mesh.rotation.y=angle;

    const speed=
      unit.speed+
      wanted*1.2;

    car.mesh.position.x+=
      Math.sin(angle)*speed*dt;

    car.mesh.position.z+=
      Math.cos(angle)*speed*dt;
  });
}


let lastCaught=0;

async function caughtByPolice(){

  const now=performance.now();

  if(now-lastCaught<4000) return;

  lastCaught=now;

  const fine=Math.min(
    money,
    100*wanted
  );

  money-=fine;

  finesPaid++;

  wanted=0;

  $("policeAlert").style.display="none";

  addChat(
    "POLICE",
    "🚔 Caught! Fine paid: ₹"+fine
  );

  updateHUD();

  await saveStats();

  respawnPlayer();
}


function respawnPlayer(){

  player.x=0;
  player.z=35;
  player.y=0;

  if(inCar){
    exitCar();
  }

  playerMesh.position.set(
    player.x,
    player.y,
    player.z
  );
}


/* =========================
   MULTIPLAYER
========================= */

async function connectMultiplayer(){

  channel=sb.channel(
    "kerala-world",
    {
      config:{
        presence:{
          key:playerId
        }
      }
    }
  );

  channel
    .on(
      "presence",
      {
        event:"sync"
      },
      ()=>{
        updatePresence();
      }
    )
    .on(
      "presence",
      {
        event:"join"
      },
      ({key,newPresences})=>{
        newPresences.forEach(p=>{
          createRemotePlayer(p);
        });
        updateOnline();
      }
    )
    .on(
      "presence",
      {
        event:"leave"
      },
      ({key})=>{
        removeRemotePlayer(key);
        updateOnline();
      }
    )
    .on(
      "broadcast",
      {
        event:"move"
      },
      ({payload})=>{
        if(payload.id!==playerId){
          updateRemotePlayer(payload);
        }
      }
    )
    .on(
      "broadcast",
      {
        event:"chat"
      },
      ({payload})=>{
        if(payload.id!==playerId){
          addChat(
            payload.name,
            payload.message
          );
        }
      }
    );

  await channel.subscribe(
    async status=>{

      if(status==="SUBSCRIBED"){

        await channel.track({
          id:playerId,
          name:playerName,
          district:district,
          x:0,
          z:35
        });
      }
    }
  );
}


function updatePresence(){

  if(!channel) return;

  const state=channel.presenceState();

  Object.keys(state).forEach(key=>{

    if(key===playerId) return;

    const p=state[key]?.[0];

    if(p) createRemotePlayer(p);
  });

  updateOnline();
}


function createRemotePlayer(p){

  if(!p || p.id===playerId) return;

  if(remotePlayers[p.id]) return;

  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .6,.7,1.8,10
    ),
    new THREE.MeshLambertMaterial({
      color:0xff7a18
    })
  );

  body.position.y=1.5;

  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(
      .6,12,12
    ),
    new THREE.MeshLambertMaterial({
      color:0xb8794c
    })
  );

  head.position.y=2.8;

  group.add(head);

  group.position.set(
    Number(p.x)||0,
    0,
    Number(p.z)||35
  );

  scene.add(group);

  remotePlayers[p.id]={
    mesh:group,
    name:p.name||"Player",
    targetX:Number(p.x)||0,
    targetZ:Number(p.z)||35
  };
}


function updateRemotePlayer(p){

  if(!remotePlayers[p.id]){
    createRemotePlayer(p);
    return;
  }

  const r=remotePlayers[p.id];

  r.targetX=Number(p.x)||0;
  r.targetZ=Number(p.z)||0;
}


function removeRemotePlayer(id){

  if(!remotePlayers[id]) return;

  scene.remove(
    remotePlayers[id].mesh
  );

  delete remotePlayers[id];
}


function updateRemoteMovement(dt){

  Object.values(remotePlayers)
    .forEach(r=>{

      r.mesh.position.x=
        THREE.MathUtils.lerp(
          r.mesh.position.x,
          r.targetX,
          Math.min(1,dt*8)
        );

      r.mesh.position.z=
        THREE.MathUtils.lerp(
          r.mesh.position.z,
          r.targetZ,
          Math.min(1,dt*8)
        );
    });
}


let lastBroadcast=0;

function broadcastPosition(){

  if(!channel) return;

  const now=performance.now();

  if(now-lastBroadcast<80) return;

  lastBroadcast=now;

  channel.send({
    type:"broadcast",
    event:"move",
    payload:{
      id:playerId,
      name:playerName,
      x:inCar&&currentCar
        ?currentCar.mesh.position.x
        :player.x,
      z:inCar&&currentCar
        ?currentCar.mesh.position.z
        :player.z
    }
  });
}


function updateOnline(){

  if(!channel){

    $("online").textContent="1";
    return;
  }

  const state=channel.presenceState();

  let count=1;

  Object.keys(state).forEach(key=>{

    if(key!==playerId) count++;
  });

  $("online").textContent=count;
}


/* =========================
   CHAT
========================= */

function sendChat(){

  const input=$("chatInput");

  const message=input.value.trim();

  if(!message) return;

  addChat(
    playerName,
    message
  );

  if(channel){

    channel.send({
      type:"broadcast",
      event:"chat",
      payload:{
        id:playerId,
        name:playerName,
        message
      }
    });
  }

  input.value="";
  input.style.display="none";
}


function addChat(name,message){

  const box=$("chat");

  const div=document.createElement("div");

  div.className="chatLine";

  div.textContent=
    name+": "+message;

  box.appendChild(div);

  while(box.children.length>5){
    box.removeChild(
      box.firstChild
    );
  }

  setTimeout(()=>{

    if(div.parentNode)
      div.remove();

  },7000);
}


/* =========================
   HUD
========================= */

function updateHUD(){

  $("hudName").textContent=
    playerName||"Player";

  $("money").textContent=
    Math.max(0,Math.floor(money));

  $("xp").textContent=
    Math.floor(xp)+"/"+(level*100);

  $("level").textContent=
    level;

  $("wanted").textContent=
    wanted;

  $("fines").textContent=
    finesPaid;
}


/* =========================
   JOYSTICK
========================= */

const joystick=$("joystick");
const stick=$("stick");

let joyActive=false;

function handleJoy(e){

  const rect=
    joystick.getBoundingClientRect();

  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  let x=e.clientX-cx;
  let y=e.clientY-cy;

  const max=43;

  const len=Math.hypot(x,y);

  if(len>max){

    x=x/len*max;
    y=y/len*max;
  }

  joyX=x/max;
  joyY=y/max;

  stick.style.transform=
    `translate(${x}px,${y}px)`;
}

joystick.addEventListener(
  "pointerdown",
  e=>{
    joyActive=true;
    joystick.setPointerCapture(e.pointerId);
    handleJoy(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{
    if(joyActive) handleJoy(e);
  }
);

joystick.addEventListener(
  "pointerup",
  ()=>{
    joyActive=false;
    joyX=0;
    joyY=0;
    stick.style.transform=
      "translate(0,0)";
  }
);

joystick.addEventListener(
  "pointercancel",
  ()=>{
    joyActive=false;
    joyX=0;
    joyY=0;
    stick.style.transform=
      "translate(0,0)";
  }
);


/* =========================
   BUTTONS
========================= */

$("runBtn").addEventListener(
  "pointerdown",
  ()=>{
    running=true;
  }
);

$("runBtn").addEventListener(
  "pointerup",
  ()=>{
    running=false;
  }
);

$("runBtn").addEventListener(
  "pointercancel",
  ()=>{
    running=false;
  }
);

$("jumpBtn").onclick=jump;

$("carBtn").onclick=toggleVehicle;

$("chatBtn").onclick=()=>{

  const input=$("chatInput");

  input.style.display=
    input.style.display==="block"
    ?"none"
    :"block";

  if(input.style.display==="block"){
    input.focus();
  }
};

$("chatInput").addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      sendChat();
    }
  }
);


/* =========================
   KEYBOARD
========================= */

addEventListener(
  "keydown",
  e=>{

    keys[e.key]=true;

    if(e.key===" "){
      jump();
    }

    if(e.key.toLowerCase()==="e"){
      toggleVehicle();
    }

    if(e.key.toLowerCase()==="t"){
      $("chatInput").style.display="block";
      $("chatInput").focus();
    }
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[e.key]=false;
  }
);


/* =========================
   MISSION MARKER ANIMATION
========================= */

function updateMissionMarker(){

  if(!missionMarker) return;

  missionMarker.rotation.y+=.03;

  missionMarker.position.y=
    .25+
    Math.sin(
      performance.now()*.004
    )*.15;
}


/* =========================
   WANTED ESCAPE
========================= */

let lastPoliceNear=0;
let escapeTimer=0;

function updateWantedEscape(dt){

  if(wanted<=0) return;

  let nearest=999;

  policeUnits.forEach(unit=>{

    const d=Math.hypot(
      unit.car.mesh.position.x-player.x,
      unit.car.mesh.position.z-player.z
    );

    nearest=Math.min(
      nearest,
      d
    );
  });

  if(nearest>45){

    escapeTimer+=dt;

    if(escapeTimer>8){

      escapeTimer=0;

      reduceWanted();
    }

  }else{

    escapeTimer=0;
  }
}


/* =========================
   MAIN LOOP
========================= */

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(
    clock.getDelta(),
    .05
  );

  updateMovement(dt);

  updateCar(dt);

  updatePolice(dt);

  updateWantedEscape(dt);

  updateRemoteMovement(dt);

  updateMissionMarker();

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

</script>
