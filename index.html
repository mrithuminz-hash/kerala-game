<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kerala World</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07130d;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}
canvas{
  display:block;
}
#loading{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#07130d;
  color:white;
}
#loading h1{
  font-size:30px;
  margin:0 0 10px;
}
#loading p{
  opacity:.7;
}
#login{
  position:fixed;
  inset:0;
  z-index:90;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(#07130dee,#10291fee);
  padding:20px;
}
.loginbox{
  width:min(420px,100%);
  background:#10251a;
  border:1px solid #31583e;
  border-radius:24px;
  padding:25px;
  color:white;
  box-shadow:0 20px 70px #0009;
}
.loginbox h1{
  margin:0;
  font-size:30px;
}
.loginbox p{
  color:#a9c3b0;
}
input,select{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:1px solid #3b6047;
  border-radius:13px;
  background:#07130d;
  color:white;
  font-size:16px;
}
button{
  border:0;
  border-radius:13px;
  padding:14px 18px;
  font-weight:bold;
  cursor:pointer;
}
#play{
  width:100%;
  margin-top:10px;
  background:#54d66d;
  color:#07130d;
  font-size:17px;
}
#hud{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:none;
}
.topbar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.card{
  background:#07130dcc;
  border:1px solid #ffffff22;
  backdrop-filter:blur(10px);
  border-radius:14px;
  color:white;
  padding:10px 13px;
}
#status{
  font-size:12px;
  color:#71ed86;
}
#playerInfo{
  font-size:13px;
}
#chat{
  pointer-events:auto;
  position:absolute;
  left:12px;
  bottom:18px;
  width:min(320px,70vw);
}
#messages{
  height:130px;
  overflow:auto;
  margin-bottom:7px;
  font-size:12px;
}
.msg{
  margin:4px 0;
  color:#dceee0;
}
.chatrow{
  display:flex;
  gap:5px;
}
#chatInput{
  margin:0;
  padding:10px;
  flex:1;
}
#send{
  background:#54d66d;
  color:#07130d;
  padding:10px;
}
#players{
  pointer-events:auto;
  position:absolute;
  top:70px;
  right:12px;
  width:190px;
  max-height:240px;
  overflow:auto;
}
.playerrow{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #ffffff12;
  font-size:12px;
}
#controls{
  position:absolute;
  left:20px;
  bottom:25px;
  width:130px;
  height:130px;
  pointer-events:auto;
}
#stick{
  position:absolute;
  width:110px;
  height:110px;
  left:10px;
  top:10px;
  border-radius:50%;
  background:#07130d99;
  border:2px solid #ffffff33;
}
#knob{
  position:absolute;
  width:50px;
  height:50px;
  left:30px;
  top:30px;
  border-radius:50%;
  background:#54d66d;
  box-shadow:0 5px 20px #0008;
}
#actions{
  position:absolute;
  right:20px;
  bottom:28px;
  display:flex;
  gap:10px;
  pointer-events:auto;
}
.action{
  width:62px;
  height:62px;
  border-radius:50%;
  background:#07130ddd;
  color:white;
  border:1px solid #ffffff33;
}
.action.active{
  background:#54d66d;
  color:#07130d;
}
#hint{
  position:absolute;
  bottom:165px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font-size:12px;
  background:#07130dbb;
  padding:7px 12px;
  border-radius:10px;
}
.hidden{
  display:none!important;
}
@media(max-width:600px){
  #players{
    width:160px;
    max-height:180px;
  }
  #chat{
    width:230px;
    bottom:165px;
  }
  #hint{
    display:none;
  }
}
</style>
</head>

<body>

<div id="loading">
  <h1>🌴 Kerala World</h1>
  <p>Loading world...</p>
</div>

<div id="login">
  <div class="loginbox">
    <h1>🌴 Kerala World</h1>
    <p>Enter the world and meet other players.</p>

    <input id="name" maxlength="18" placeholder="Your player name">

    <select id="district">
      <option value="">Select your district</option>
      <option>Thiruvananthapuram</option>
      <option>Kollam</option>
      <option>Pathanamthitta</option>
      <option>Alappuzha</option>
      <option>Kottayam</option>
      <option>Idukki</option>
      <option>Ernakulam</option>
      <option>Thrissur</option>
      <option>Palakkad</option>
      <option>Malappuram</option>
      <option>Kozhikode</option>
      <option>Wayanad</option>
      <option>Kannur</option>
      <option>Kasaragod</option>
    </select>

    <button id="play">ENTER KERALA WORLD</button>
  </div>
</div>

<div id="hud">

  <div class="topbar">
    <div class="card">
      <div id="playerInfo">Player</div>
      <div id="status">Connecting...</div>
    </div>

    <div class="card">
      👥 <span id="online">1</span> online
    </div>
  </div>

  <div id="players" class="card">
    <b>Players</b>
    <div id="playerList"></div>
  </div>

  <div id="hint">
    Desktop: WASD / Arrow keys · Mobile: joystick
  </div>

  <div id="chat" class="card">
    <div id="messages"></div>

    <div class="chatrow">
      <input id="chatInput" placeholder="Say something..." maxlength="100">
      <button id="send">SEND</button>
    </div>
  </div>

  <div id="controls">
    <div id="stick">
      <div id="knob"></div>
    </div>
  </div>

  <div id="actions">
    <button class="action" id="jump">JUMP</button>
    <button class="action" id="run">RUN</button>
  </div>

</div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://putlvisgkmjtiqmxkdda.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_P_a8u-8fi3GPBplKJeKNog_lp0ElC_S";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      realtime:{
        params:{
          eventsPerSecond:30
        }
      }
    }
  );

/* =========================================================
   GAME STATE
========================================================= */

let player = {
  id:null,
  name:"",
  district:"",
  x:0,
  y:1,
  z:0,
  rot:0,
  score:0
};

let channel = null;
let remotePlayers = {};
let keys = {};
let moveX = 0;
let moveZ = 0;
let running = false;
let jumping = false;
let jumpVelocity = 0;
let lastBroadcast = 0;

/* =========================================================
   THREE.JS
========================================================= */

let scene;
let camera;
let renderer;
let clock;

let playerMesh;
let worldGroup;
let remoteGroup;

const playerMeshes = {};

/* =========================================================
   DOM
========================================================= */

const loading = document.getElementById("loading");
const login = document.getElementById("login");
const hud = document.getElementById("hud");
const nameInput = document.getElementById("name");
const districtInput = document.getElementById("district");
const playButton = document.getElementById("play");
const statusEl = document.getElementById("status");
const onlineEl = document.getElementById("online");
const playerList = document.getElementById("playerList");
const playerInfo = document.getElementById("playerInfo");
const messages = document.getElementById("messages");
const chatInput = document.getElementById("chatInput");
const sendButton = document.getElementById("send");
const jumpButton = document.getElementById("jump");
const runButton = document.getElementById("run");

/* =========================================================
   BASIC THREE WORLD
========================================================= */

function initThree(){

  scene = new THREE.Scene();

  scene.background = new THREE.Color(0x8cc9e8);

  scene.fog = new THREE.Fog(
    0x8cc9e8,
    45,
    190
  );

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    500
  );

  camera.position.set(0,7,10);

  renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.8)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.shadowMap.enabled = true;

  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  const ambient =
    new THREE.HemisphereLight(
      0xffffff,
      0x42634b,
      2.2
    );

  scene.add(ambient);

  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  sun.position.set(
    30,
    60,
    20
  );

  sun.castShadow = true;

  scene.add(sun);

  worldGroup = new THREE.Group();
  remoteGroup = new THREE.Group();

  scene.add(worldGroup);
  scene.add(remoteGroup);

  createWorld();
  createLocalPlayer();

  window.addEventListener(
    "resize",
    resize
  );

  animate();
}

/* =========================================================
   WORLD
========================================================= */

function createWorld(){

  // Ground
  const groundGeo =
    new THREE.PlaneGeometry(
      260,
      260,
      20,
      20
    );

  const groundMat =
    new THREE.MeshStandardMaterial({
      color:0x438653,
      roughness:1
    });

  const ground =
    new THREE.Mesh(
      groundGeo,
      groundMat
    );

  ground.rotation.x =
    -Math.PI / 2;

  ground.receiveShadow = true;

  worldGroup.add(ground);

  // Roads
  for(let i=-3;i<=3;i++){

    const roadGeo =
      new THREE.BoxGeometry(
        260,
        .05,
        3
      );

    const roadMat =
      new THREE.MeshStandardMaterial({
        color:0x454545
      });

    const road =
      new THREE.Mesh(
        roadGeo,
        roadMat
      );

    road.position.set(
      0,
      .03,
      i*28
    );

    worldGroup.add(road);
  }

  for(let i=-3;i<=3;i++){

    const roadGeo =
      new THREE.BoxGeometry(
        3,
        .05,
        260
      );

    const roadMat =
      new THREE.MeshStandardMaterial({
        color:0x454545
      });

    const road =
      new THREE.Mesh(
        roadGeo,
        roadMat
      );

    road.position.set(
      i*28,
      .04,
      0
    );

    worldGroup.add(road);
  }

  // Trees
  for(let i=0;i<120;i++){

    const x =
      (Math.random()-.5)*230;

    const z =
      (Math.random()-.5)*230;

    // Keep roads relatively clear
    if(
      Math.abs(x%28)<5 ||
      Math.abs(z%28)<5
    ) continue;

    createPalm(x,z);
  }

  // Houses
  for(let i=0;i<35;i++){

    const x =
      (Math.random()-.5)*210;

    const z =
      (Math.random()-.5)*210;

    if(
      Math.abs(x%28)<7 ||
      Math.abs(z%28)<7
    ) continue;

    createHouse(x,z);
  }

  // Water
  const waterGeo =
    new THREE.BoxGeometry(
      45,
      .3,
      100
    );

  const waterMat =
    new THREE.MeshStandardMaterial({
      color:0x2d9ed0,
      transparent:true,
      opacity:.82
    });

  const water =
    new THREE.Mesh(
      waterGeo,
      waterMat
    );

  water.position.set(
    -75,
    .08,
    20
  );

  worldGroup.add(water);

  // Landmark
  createTemple(
    20,
    -25
  );

  // Spawn marker
  createSpawn(
    0,
    0
  );
}

function createPalm(x,z){

  const group =
    new THREE.Group();

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .18,
        .28,
        4,
        7
      ),
      new THREE.MeshStandardMaterial({
        color:0x81562f
      })
    );

  trunk.position.y=2;

  group.add(trunk);

  for(let i=0;i<7;i++){

    const leaf =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .15,
          .08,
          2.8
        ),
        new THREE.MeshStandardMaterial({
          color:0x176b35
        })
      );

    leaf.position.y=4.1;

    leaf.rotation.y =
      i*Math.PI/3.5;

    leaf.rotation.x=.25;

    group.add(leaf);
  }

  group.position.set(
    x,0,z
  );

  worldGroup.add(group);
}

function createHouse(x,z){

  const group =
    new THREE.Group();

  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5,
        3.2,
        4
      ),
      new THREE.MeshStandardMaterial({
        color:
          [0xe5d4ad,0xd9b58a,0xbfd3c4]
          [Math.floor(Math.random()*3)]
      })
    );

  body.position.y=1.6;

  group.add(body);

  const roof =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        3.8,
        2.2,
        4
      ),
      new THREE.MeshStandardMaterial({
        color:0x8b3329
      })
    );

  roof.position.y=4.2;
  roof.rotation.y=Math.PI/4;

  group.add(roof);

  group.position.set(
    x,0,z
  );

  worldGroup.add(group);
}

function createTemple(x,z){

  const group =
    new THREE.Group();

  const base =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        9,1,7
      ),
      new THREE.MeshStandardMaterial({
        color:0xe7c36d
      })
    );

  base.position.y=.5;

  group.add(base);

  for(let i=0;i<3;i++){

    const tower =
      new THREE.Mesh(
        new THREE.ConeGeometry(
          2.5-i*.5,
          3-i*.5,
          4
        ),
        new THREE.MeshStandardMaterial({
          color:0xd58c2b
        })
      );

    tower.position.set(
      (i-1)*3,
      2.5+i*.3,
      0
    );

    tower.rotation.y=Math.PI/4;

    group.add(tower);
  }

  group.position.set(x,0,z);

  worldGroup.add(group);
}

function createSpawn(x,z){

  const ring =
    new THREE.Mesh(
      new THREE.RingGeometry(
        3,
        3.2,
        32
      ),
      new THREE.MeshBasicMaterial({
        color:0x54d66d,
        transparent:true,
        opacity:.5,
        side:THREE.DoubleSide
      })
    );

  ring.rotation.x=-Math.PI/2;

  ring.position.set(
    x,.05,z
  );

  worldGroup.add(ring);
}

/* =========================================================
   PLAYER
========================================================= */

function makeCharacter(color=0x54d66d){

  const group =
    new THREE.Group();

  const body =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .55,
        1.25,
        5,
        10
      ),
      new THREE.MeshStandardMaterial({
        color
      })
    );

  body.position.y=1.15;
  body.castShadow=true;

  group.add(body);

  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .48,
        16,
        16
      ),
      new THREE.MeshStandardMaterial({
        color:0xc98c63
      })
    );

  head.position.y=2.25;
  head.castShadow=true;

  group.add(head);

  return group;
}

function createLocalPlayer(){

  playerMesh =
    makeCharacter(0x54d66d);

  playerMesh.position.set(
    0,0,0
  );

  scene.add(playerMesh);
}

/* =========================================================
   PLAYER NAME LABEL
========================================================= */

function makeLabel(text){

  const canvas =
    document.createElement("canvas");

  canvas.width=512;
  canvas.height=128;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle="#ffffff";
  ctx.font="bold 42px Arial";
  ctx.textAlign="center";

  ctx.strokeStyle="#000000";
  ctx.lineWidth=8;

  ctx.strokeText(
    text,
    256,
    70
  );

  ctx.fillText(
    text,
    256,
    70
  );

  const texture =
    new THREE.CanvasTexture(canvas);

  const material =
    new THREE.SpriteMaterial({
      map:texture,
      transparent:true
    });

  const sprite =
    new THREE.Sprite(material);

  sprite.scale.set(
    4,
    1,
    1
  );

  sprite.position.y=3.2;

  return sprite;
}

/* =========================================================
   LOGIN
========================================================= */

playButton.addEventListener(
  "click",
  startGame
);

async function startGame(){

  const name =
    nameInput.value.trim();

  const district =
    districtInput.value;

  if(!name){

    alert("Enter your player name");
    return;
  }

  if(!district){

    alert("Select your district");
    return;
  }

  playButton.disabled=true;
  playButton.textContent="CONNECTING...";

  player.name=name;
  player.district=district;

  localStorage.setItem(
    "kerala_name",
    name
  );

  localStorage.setItem(
    "kerala_district",
    district
  );

  try{

    const {data,error} =
      await supabaseClient
        .from("players")
        .insert({
          name:name,
          district:district,
          score:0,
          room:"main"
        })
        .select()
        .single();

    if(error) throw error;

    player.id=data.id;
    player.score=data.score || 0;

    login.classList.add("hidden");
    hud.style.display="block";

    playerInfo.textContent =
      `${player.name} · ${player.district}`;

    await connectRealtime();

    statusEl.textContent =
      "🟢 Connected";

  }catch(error){

    console.error(error);

    alert(
      "Couldn't connect to game.\n\n"+
      (error.message || "Unknown error")
    );

    playButton.disabled=false;
    playButton.textContent=
      "ENTER KERALA WORLD";
  }
}

/* =========================================================
   REALTIME
========================================================= */

async function connectRealtime(){

  channel =
    supabaseClient.channel(
      "kerala-world-main",
      {
        config:{
          presence:{
            key:player.id
          },
          broadcast:{
            self:false
          }
        }
      }
    );

  channel
    .on(
      "presence",
      {
        event:"sync"
      },
      handlePresence
    )
    .on(
      "presence",
      {
        event:"join"
      },
      handlePresence
    )
    .on(
      "presence",
      {
        event:"leave"
      },
      handlePresence
    )
    .on(
      "broadcast",
      {
        event:"position"
      },
      payload=>{
        if(
          payload.payload &&
          payload.payload.id !== player.id
        ){
          remotePlayers[
            payload.payload.id
          ] =
            payload.payload;

          updateRemotePlayers();
        }
      }
    )
    .on(
      "broadcast",
      {
        event:"chat"
      },
      payload=>{

        if(
          payload.payload &&
          payload.payload.id !== player.id
        ){

          addMessage(
            payload.payload.name,
            payload.payload.text
          );
        }
      }
    );

  await new Promise(
    (resolve,reject)=>{

      channel.subscribe(
        async status=>{

          if(status==="SUBSCRIBED"){

            await channel.track({
              id:player.id,
              name:player.name,
              district:player.district,
              x:player.x,
              y:player.y,
              z:player.z,
              rot:player.rot,
              score:player.score
            });

            resolve();
          }

          if(status==="CHANNEL_ERROR"){

            reject(
              new Error(
                "Realtime channel error"
              )
            );
          }
        }
      );

    }
  );
}

function handlePresence(){

  if(!channel) return;

  const state =
    channel.presenceState();

  remotePlayers={};

  Object.keys(state).forEach(key=>{

    const list=state[key];

    if(!list || !list.length) return;

    const p=list[list.length-1];

    if(p.id !== player.id){

      remotePlayers[p.id]=p;
    }
  });

  updateRemotePlayers();
}

/* =========================================================
   REMOTE PLAYERS
========================================================= */

function updateRemotePlayers(){

  Object.keys(playerMeshes).forEach(id=>{

    if(!remotePlayers[id]){

      remoteGroup.remove(
        playerMeshes[id]
      );

      delete playerMeshes[id];
    }
  });

  Object.keys(remotePlayers).forEach(id=>{

    const p =
      remotePlayers[id];

    if(!playerMeshes[id]){

      const colors=[
        0xff6b6b,
        0x5da9ff,
        0xffcf5c,
        0xc77dff,
        0xff8fab
      ];

      const mesh =
        makeCharacter(
          colors[
            Math.floor(
              Math.random()*colors.length
            )
          ]
        );

      mesh.position.set(
        p.x||0,
        p.y||0,
        p.z||0
      );

      mesh.rotation.y=
        p.rot||0;

      mesh.add(
        makeLabel(
          p.name || "Player"
        )
      );

      remoteGroup.add(mesh);

      playerMeshes[id]=mesh;

    }else{

      const mesh =
        playerMeshes[id];

      mesh.position.lerp(
        new THREE.Vector3(
          p.x||0,
          p.y||0,
          p.z||0
        ),
        .35
      );

      mesh.rotation.y =
        p.rot||0;
    }
  });

  renderPlayerList();
}

/* =========================================================
   PLAYER LIST
========================================================= */

function renderPlayerList(){

  const all=[
    {
      id:player.id,
      name:player.name,
      district:player.district,
      score:player.score
    },
    ...Object.values(remotePlayers)
  ];

  onlineEl.textContent=
    all.length;

  playerList.innerHTML=
    all.map(p=>`
      <div class="playerrow">
        <span>
          ${escapeHtml(p.name||"Player")}
        </span>
        <span>
          ${Number(p.score||0)}
        </span>
      </div>
    `).join("");
}

/* =========================================================
   MOVEMENT
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  updateMovement(dt);

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

function updateMovement(dt){

  let x=moveX;
  let z=moveZ;

  if(keys["w"] || keys["ArrowUp"])
    z-=1;

  if(keys["s"] || keys["ArrowDown"])
    z+=1;

  if(keys["a"] || keys["ArrowLeft"])
    x-=1;

  if(keys["d"] || keys["ArrowRight"])
    x+=1;

  const length =
    Math.hypot(x,z);

  if(length>0){

    x/=length;
    z/=length;

    const speed =
      running ? 9 : 5;

    player.x +=
      x*speed*dt;

    player.z +=
      z*speed*dt;

    player.rot =
      Math.atan2(
        x,
        z
      );

    playerMesh.rotation.y=
      player.rot;

    playerMesh.position.x=
      player.x;

    playerMesh.position.z=
      player.z;
  }

  if(jumping){

    player.y +=
      jumpVelocity*dt;

    jumpVelocity -=
      18*dt;

    if(player.y<=0){

      player.y=0;
      jumping=false;
      jumpVelocity=0;
    }

    playerMesh.position.y=
      player.y;
  }

  broadcastPosition();
}

function broadcastPosition(){

  if(!channel) return;

  const now=
    performance.now();

  if(now-lastBroadcast<50)
    return;

  lastBroadcast=now;

  channel.send({
    type:"broadcast",
    event:"position",
    payload:{
      id:player.id,
      name:player.name,
      district:player.district,
      x:player.x,
      y:player.y,
      z:player.z,
      rot:player.rot,
      score:player.score
    }
  });
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  if(!playerMesh) return;

  const target =
    new THREE.Vector3(
      player.x,
      player.y+1.5,
      player.z
    );

  const desired =
    new THREE.Vector3(
      player.x,
      player.y+6,
      player.z+9
    );

  camera.position.lerp(
    desired,
    .08
  );

  camera.lookAt(target);
}

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    keys[e.key]=true;

    if(e.key==="Shift")
      running=true;

    if(
      e.code==="Space" &&
      !jumping
    ){
      jump();
    }
  }
);

window.addEventListener(
  "keyup",
  e=>{

    keys[e.key]=false;

    if(e.key==="Shift")
      running=false;
  }
);

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const stick =
  document.getElementById("stick");

const knob =
  document.getElementById("knob");

let joystickActive=false;

function joystickMove(e){

  const rect =
    stick.getBoundingClientRect();

  const cx =
    rect.left+rect.width/2;

  const cy =
    rect.top+rect.height/2;

  let dx=
    e.clientX-cx;

  let dy=
    e.clientY-cy;

  const max=40;

  const dist=
    Math.hypot(dx,dy);

  if(dist>max){

    dx=
      dx/dist*max;

    dy=
      dy/dist*max;
  }

  knob.style.transform=
    `translate(${dx}px,${dy}px)`;

  moveX=
    dx/max;

  moveZ=
    dy/max;
}

stick.addEventListener(
  "pointerdown",
  e=>{

    joystickActive=true;

    stick.setPointerCapture(
      e.pointerId
    );

    joystickMove(e);
  }
);

stick.addEventListener(
  "pointermove",
  e=>{

    if(
      joystickActive
    ){
      joystickMove(e);
    }
  }
);

stick.addEventListener(
  "pointerup",
  ()=>{
    joystickActive=false;
    moveX=0;
    moveZ=0;
    knob.style.transform=
      "translate(0,0)";
  }
);

stick.addEventListener(
  "pointercancel",
  ()=>{
    joystickActive=false;
    moveX=0;
    moveZ=0;
    knob.style.transform=
      "translate(0,0)";
  }
);

/* =========================================================
   ACTIONS
========================================================= */

runButton.addEventListener(
  "pointerdown",
  ()=>{
    running=true;
    runButton.classList.add("active");
  }
);

runButton.addEventListener(
  "pointerup",
  ()=>{
    running=false;
    runButton.classList.remove("active");
  }
);

runButton.addEventListener(
  "pointercancel",
  ()=>{
    running=false;
    runButton.classList.remove("active");
  }
);

jumpButton.addEventListener(
  "click",
  jump
);

function jump(){

  if(jumping) return;

  jumping=true;
  jumpVelocity=8;
}

/* =========================================================
   CHAT
========================================================= */

sendButton.addEventListener(
  "click",
  sendChat
);

chatInput.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter")
      sendChat();
  }
);

function sendChat(){

  const text =
    chatInput.value.trim();

  if(!text || !channel)
    return;

  addMessage(
    "You",
    text
  );

  channel.send({
    type:"broadcast",
    event:"chat",
    payload:{
      id:player.id,
      name:player.name,
      text:text
    }
  });

  chatInput.value="";
}

function addMessage(
  name,
  text
){

  const div =
    document.createElement("div");

  div.className="msg";

  div.textContent=
    `${name}: ${text}`;

  messages.appendChild(div);

  while(
    messages.children.length>30
  ){

    messages.removeChild(
      messages.firstChild
    );
  }

  messages.scrollTop=
    messages.scrollHeight;
}

/* =========================================================
   DATABASE SCORE
========================================================= */

async function saveScore(){

  if(!player.id) return;

  await supabaseClient
    .from("players")
    .update({
      score:player.score
    })
    .eq(
      "id",
      player.id
    );
}

/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  async ()=>{
    try{

      if(channel)
        await channel.untrack();

    }catch(e){}
  }
);

/* =========================================================
   RESIZE
========================================================= */

function resize(){

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

if(savedName)

if(savedDistrict)

loading.classList.add(

);
