<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kerala World</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
  touch-action:none;
}
canvas{
  display:block;
  position:fixed;
  inset:0;
}
#login{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),
    linear-gradient(135deg,#178b52,#0d5c42);
}
.box{
  width:min(90%,390px);
  padding:28px;
  border-radius:24px;
  background:rgba(255,255,255,.95);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  text-align:center;
}
.box h1{
  margin:0 0 6px;
  font-size:32px;
  color:#087443;
}
.box p{
  margin:0 0 20px;
  color:#555;
}
input,select{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}
button{
  border:0;
  border-radius:14px;
  padding:13px 18px;
  font-weight:bold;
  cursor:pointer;
}
#enter{
  width:100%;
  margin-top:10px;
  background:#087443;
  color:white;
  font-size:17px;
}
#status{
  min-height:20px;
  margin-top:10px;
  font-size:13px;
  color:#d33;
}

#hud{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}
#top{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.panel{
  background:rgba(0,0,0,.48);
  color:#fff;
  padding:9px 13px;
  border-radius:13px;
  backdrop-filter:blur(8px);
}
#online{
  font-size:14px;
}
#location{
  font-size:12px;
  opacity:.85;
  margin-top:3px;
}
#chat{
  position:absolute;
  left:12px;
  top:90px;
  width:min(75%,330px);
  max-height:180px;
  overflow:hidden;
  pointer-events:none;
}
.msg{
  background:rgba(0,0,0,.45);
  color:#fff;
  padding:6px 9px;
  margin:4px 0;
  border-radius:9px;
  font-size:12px;
}
#chatForm{
  position:absolute;
  left:12px;
  bottom:15px;
  width:min(72%,340px);
  display:flex;
  gap:6px;
  pointer-events:auto;
}
#chatInput{
  flex:1;
  border:0;
  padding:12px;
  border-radius:14px;
  outline:none;
}
#send{
  background:#087443;
  color:white;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:80px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.3);
  pointer-events:auto;
}
#stick{
  position:absolute;
  width:55px;
  height:55px;
  left:35px;
  top:35px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
  box-shadow:0 4px 15px rgba(0,0,0,.2);
}
.controls{
  position:absolute;
  right:18px;
  bottom:78px;
  display:flex;
  gap:12px;
  pointer-events:auto;
}
.control{
  width:65px;
  height:65px;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  color:#fff;
  border:2px solid rgba(255,255,255,.3);
  font-size:12px;
}
#jump{
  background:rgba(20,130,80,.75);
}
#run{
  background:rgba(40,90,170,.75);
}
#loading{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.5);
  color:#fff;
  font-size:18px;
}
</style>
</head>

<body>

<div id="login">
  <div class="box">
    <h1>🌴 Kerala World</h1>
    <p>Welcome to the multiplayer Kerala world</p>

    <input id="name" placeholder="Enter your name" maxlength="20">

    <select id="district">
      <option value="Ernakulam">Ernakulam</option>
      <option value="Thiruvananthapuram">Thiruvananthapuram</option>
      <option value="Kozhikode">Kozhikode</option>
      <option value="Thrissur">Thrissur</option>
      <option value="Malappuram">Malappuram</option>
      <option value="Kollam">Kollam</option>
      <option value="Alappuzha">Alappuzha</option>
      <option value="Kottayam">Kottayam</option>
      <option value="Kannur">Kannur</option>
      <option value="Palakkad">Palakkad</option>
      <option value="Idukki">Idukki</option>
      <option value="Wayanad">Wayanad</option>
      <option value="Pathanamthitta">Pathanamthitta</option>
      <option value="Kasaragod">Kasaragod</option>
    </select>

    <button id="enter">ENTER KERALA WORLD</button>
    <div id="status"></div>
  </div>
</div>

<div id="loading">Loading Kerala World...</div>

<div id="hud">

  <div id="top">
    <div class="panel">
      <b>🌴 Kerala World</b>
      <div id="location">Ernakulam</div>
    </div>

    <div class="panel">
      👥 <span id="online">0</span> Online
    </div>
  </div>

  <div id="chat"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div class="controls">
    <button class="control" id="run">RUN</button>
    <button class="control" id="jump">JUMP</button>
  </div>

  <form id="chatForm">
    <input id="chatInput" placeholder="Chat..." maxlength="100">
    <button id="send">SEND</button>
  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://putlvisgkmjtiqmxkdda.supabase.co";

const SUPABASE_KEY =
"sb_publishable_P_a8u-8fi3GPBplKJeKNog_lp0ElC_S";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* =========================
   GLOBALS
========================= */

let scene,camera,renderer;
let player;
let remotePlayers={};
let channel;

let playerId=null;
let playerName="";
let playerDistrict="";

let keys={};
let joystick={
  x:0,
  y:0
};

let velocityY=0;
let onGround=true;
let running=false;

const worldSize=900;
const clock=new THREE.Clock();

/* =========================
   LOGIN
========================= */

const login=document.getElementById("login");
const hud=document.getElementById("hud");
const loading=document.getElementById("loading");

document.getElementById("enter").onclick=startGame;

async function startGame(){

  playerName=
    document.getElementById("name").value.trim();

  playerDistrict=
    document.getElementById("district").value;

  if(!playerName){
    document.getElementById("status").textContent=
      "Please enter your name";
    return;
  }

  loading.style.display="flex";

  try{

    const result=await supabaseClient
      .from("players")
      .insert({
        name:playerName,
        district:playerDistrict,
        score:0,
        room:"kerala-world"
      })
      .select()
      .single();

    if(result.error) throw result.error;

    playerId=result.data.id;

    localStorage.setItem("kerala_name",playerName);
    localStorage.setItem("kerala_district",playerDistrict);

    login.style.display="none";
    hud.style.display="block";

    document.getElementById("location").textContent=
      playerDistrict;

    initThree();
    createWorld();
    createPlayer();
    setupMultiplayer();

    loading.style.display="none";

  }catch(error){

    loading.style.display="none";

    document.getElementById("status").textContent=
      "Connection error: "+error.message;

    console.error(error);
  }
}

/* =========================
   THREE
========================= */

function initThree(){

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x87ceeb);

  scene.fog=
    new THREE.Fog(0x87ceeb,180,650);

  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    1200
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
  );

  renderer.setSize(innerWidth,innerHeight);

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  document.body.appendChild(renderer.domElement);

  const hemi=
    new THREE.HemisphereLight(
      0xffffff,
      0x567d42,
      1.5
    );

  scene.add(hemi);

  const sun=
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  sun.position.set(150,250,100);
  sun.castShadow=true;

  sun.shadow.mapSize.width=1024;
  sun.shadow.mapSize.height=1024;

  scene.add(sun);

  window.addEventListener(
    "resize",
    resize
  );

  animate();
}

/* =========================
   WORLD
========================= */

function createWorld(){

  /* Ground */

  const groundMat=
    new THREE.MeshStandardMaterial({
      color:0x3f963c,
      roughness:1
    });

  const ground=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        worldSize,
        worldSize
      ),
      groundMat
    );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;

  scene.add(ground);

  /* Main road */

  createRoad(
    0,
    0,
    worldSize,
    20,
    0
  );

  createRoad(
    0,
    0,
    worldSize,
    18,
    Math.PI/2
  );

  /* Side roads */

  for(let x=-300;x<=300;x+=100){
    createRoad(
      x,
      0,
      100,
      10,
      Math.PI/2
    );
  }

  for(let z=-300;z<=300;z+=100){
    createRoad(
      0,
      z,
      100,
      10,
      0
    );
  }

  /* River */

  const riverMat=
    new THREE.MeshStandardMaterial({
      color:0x3b9ed8,
      roughness:.25,
      metalness:.05
    });

  const river=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        110,
        worldSize
      ),
      riverMat
    );

  river.rotation.x=-Math.PI/2;
  river.position.set(280,.02,0);

  scene.add(river);

  /* River banks */

  for(let i=-400;i<400;i+=18){

    createPalm(
      215,
      i+8
    );

    createPalm(
      345,
      i-4
    );
  }

  /* Houses */

  for(let i=0;i<85;i++){

    const x=
      (Math.random()-.5)*760;

    const z=
      (Math.random()-.5)*760;

    if(
      Math.abs(x)<55 ||
      Math.abs(z)<55 ||
      Math.abs(x-280)<75
    ) continue;

    createHouse(x,z);
  }

  /* Palm trees */

  for(let i=0;i<150;i++){

    const x=
      (Math.random()-.5)*820;

    const z=
      (Math.random()-.5)*820;

    if(
      Math.abs(x)<45 ||
      Math.abs(z)<45 ||
      Math.abs(x-280)<70
    ) continue;

    createPalm(x,z);
  }

  /* Shops */

  createShop(
    -80,
    -70,
    "TEA SHOP"
  );

  createShop(
    80,
    70,
    "KERALA STORE"
  );

  createShop(
    -80,
    70,
    "FRESH JUICE"
  );

  createShop(
    80,
    -70,
    "HOTEL"
  );

  /* Temple */

  createTemple(0,0);

  /* Mountains */

  for(let i=0;i<28;i++){

    const angle=
      (i/28)*Math.PI*2;

    const radius=410;

    createMountain(
      Math.cos(angle)*radius,
      Math.sin(angle)*radius
    );
  }

  /* Street lamps */

  for(let i=-400;i<=400;i+=40){

    createLamp(i,-14);
    createLamp(i,14);

    createLamp(-14,i);
    createLamp(14,i);
  }
}

/* =========================
   ROAD
========================= */

function createRoad(
  x,
  z,
  length,
  width,
  rotation
){

  const road=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        width,
        length
      ),
      new THREE.MeshStandardMaterial({
        color:0x303030,
        roughness:1
      })
    );

  road.rotation.x=-Math.PI/2;
  road.rotation.z=rotation;
  road.position.set(x,.025,z);

  scene.add(road);

  /* center lines */

  for(
    let i=-length/2;
    i<length/2;
    i+=16
  ){

    const line=
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          1,
          8
        ),
        new THREE.MeshBasicMaterial({
          color:0xffd84a
        })
      );

    line.rotation.x=-Math.PI/2;
    line.rotation.z=rotation;

    if(rotation===0){
      line.position.set(
        x,
        .04,
        z+i
      );
    }else{
      line.position.set(
        x+i,
        .04,
        z
      );
    }

    scene.add(line);
  }
}

/* =========================
   HOUSE
========================= */

function createHouse(x,z){

  const group=
    new THREE.Group();

  const body=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        18,
        9,
        15
      ),
      new THREE.MeshStandardMaterial({
        color:
          [0xffe1a8,0xffffff,0xf0c38a,0xc9e7d1]
          [Math.floor(Math.random()*4)]
      })
    );

  body.position.y=4.5;
  body.castShadow=true;
  body.receiveShadow=true;

  group.add(body);

  const roof=
    new THREE.Mesh(
      new THREE.ConeGeometry(
        13,
        7,
        4
      ),
      new THREE.MeshStandardMaterial({
        color:0x9d3b27
      })
    );

  roof.rotation.y=Math.PI/4;
  roof.position.y=12;

  roof.castShadow=true;

  group.add(roof);

  const door=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.7,
        5,
        .4
      ),
      new THREE.MeshStandardMaterial({
        color:0x55331d
      })
    );

  door.position.set(
    0,
    2.5,
    7.7
  );

  group.add(door);

  for(const side of [-1,1]){

    const window=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          3,
          2.5,
          .35
        ),
        new THREE.MeshStandardMaterial({
          color:0x6db6d9,
          metalness:.2
        })
      );

    window.position.set(
      side*5,
      5,
      7.65
    );

    group.add(window);
  }

  group.position.set(x,0,z);

  scene.add(group);
}

/* =========================
   SHOP
========================= */

function createShop(x,z,title){

  const group=
    new THREE.Group();

  const base=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        20,
        9,
        15
      ),
      new THREE.MeshStandardMaterial({
        color:0xf5e0a0
      })
    );

  base.position.y=4.5;
  group.add(base);

  const roof=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        23,
        1.5,
        18
      ),
      new THREE.MeshStandardMaterial({
        color:0x1c663d
      })
    );

  roof.position.y=10;
  group.add(roof);

  const sign=
    createText(title);

  sign.position.set(
    0,
    8,
    7.7
  );

  group.add(sign);

  group.position.set(x,0,z);

  scene.add(group);
}

/* =========================
   TEXT SPRITE
========================= */

function createText(text){

  const canvas=
    document.createElement("canvas");

  canvas.width=512;
  canvas.height=128;

  const ctx=
    canvas.getContext("2d");

  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,512,128);

  ctx.fillStyle="#075b38";
  ctx.font="bold 48px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    text,
    256,
    64
  );

  const texture=
    new THREE.CanvasTexture(canvas);

  const sprite=
    new THREE.Sprite(
      new THREE.SpriteMaterial({
        map:texture
      })
    );

  sprite.scale.set(10,2.5,1);

  return sprite;
}

/* =========================
   PALM
========================= */

function createPalm(x,z){

  const group=
    new THREE.Group();

  const trunk=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .7,
        1.1,
        12,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x7b4c27
      })
    );

  trunk.position.y=6;

  group.add(trunk);

  for(let i=0;i<7;i++){

    const leaf=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .5,
          .3,
          7
        ),
        new THREE.MeshStandardMaterial({
          color:0x147b32
        })
      );

    const angle=
      (i/7)*Math.PI*2;

    leaf.position.y=12;
    leaf.rotation.y=angle;
    leaf.rotation.x=.25;

    leaf.position.x=
      Math.sin(angle)*2;

    leaf.position.z=
      Math.cos(angle)*2;

    group.add(leaf);
  }

  group.position.set(x,0,z);

  const scale=
    .75+Math.random()*.6;

  group.scale.setScalar(scale);

  scene.add(group);
}

/* =========================
   TEMPLE
========================= */

function createTemple(x,z){

  const group=
    new THREE.Group();

  const base=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        14,
        16,
        2,
        32
      ),
      new THREE.MeshStandardMaterial({
        color:0xd4a33b
      })
    );

  base.position.y=1;

  group.add(base);

  const tower=
    new THREE.Mesh(
      new THREE.ConeGeometry(
        10,
        20,
        6
      ),
      new THREE.MeshStandardMaterial({
        color:0xb86a2b
      })
    );

  tower.position.y=12;

  group.add(tower);

  const sign=
    createText("KERALA TEMPLE");

  sign.position.y=23;

  group.add(sign);

  group.position.set(x,0,z);

  scene.add(group);
}

/* =========================
   MOUNTAIN
========================= */

function createMountain(x,z){

  const mountain=
    new THREE.Mesh(
      new THREE.ConeGeometry(
        55+Math.random()*35,
        90+Math.random()*60,
        7
      ),
      new THREE.MeshStandardMaterial({
        color:0x497b43,
        roughness:1
      })
    );

  mountain.position.set(
    x,
    35,
    z
  );

  scene.add(mountain);
}

/* =========================
   LAMP
========================= */

function createLamp(x,z){

  const group=
    new THREE.Group();

  const pole=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .12,
        .15,
        5,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x333333
      })
    );

  pole.position.y=2.5;

  group.add(pole);

  const light=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .35,
        12,
        12
      ),
      new THREE.MeshBasicMaterial({
        color:0xffe8a0
      })
    );

  light.position.y=5.2;

  group.add(light);

  group.position.set(x,0,z);

  scene.add(group);
}

/* =========================
   PLAYER
========================= */

function createPlayer(){

  player=
    new THREE.Group();

  const body=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        1.25,
        2.8,
        5,
        10
      ),
      new THREE.MeshStandardMaterial({
        color:0x1266a0
      })
    );

  body.position.y=2.5;
  body.castShadow=true;

  player.add(body);

  const head=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.15,
        16,
        16
      ),
      new THREE.MeshStandardMaterial({
        color:0xb87952
      })
    );

  head.position.y=5;

  head.castShadow=true;

  player.add(head);

  const label=
    createText(playerName);

  label.position.y=7;

  label.scale.set(7,1.8,1);

  player.add(label);

  player.position.set(
    0,
    0,
    35
  );

  scene.add(player);
}

/* =========================
   REMOTE PLAYER
========================= */

function createRemotePlayer(
  id,
  data
){

  if(remotePlayers[id])
    return remotePlayers[id];

  const group=
    new THREE.Group();

  const body=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        1.25,
        2.8,
        5,
        10
      ),
      new THREE.MeshStandardMaterial({
        color:0x9b3d8b
      })
    );

  body.position.y=2.5;
  body.castShadow=true;

  group.add(body);

  const head=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.15,
        16,
        16
      ),
      new THREE.MeshStandardMaterial({
        color:0xb87952
      })
    );

  head.position.y=5;

  group.add(head);

  const label=
    createText(
      data.name || "Player"
    );

  label.position.y=7;

  label.scale.set(7,1.8,1);

  group.add(label);

  group.position.set(
    data.x || 0,
    data.y || 0,
    data.z || 0
  );

  scene.add(group);

  remotePlayers[id]=group;

  updateOnline();

  return group;
}

/* =========================
   MULTIPLAYER
========================= */

async function setupMultiplayer(){

  channel=
    supabaseClient.channel(
      "kerala-world-main",
      {
        config:{
          presence:{
            key:playerId
          },
          broadcast:{
            self:false
          }
        }
      }
    );

  channel
    .on(
      "presence",
      {
        event:"sync"
      },
      handlePresence
    )
    .on(
      "presence",
      {
        event:"join"
      },
      handlePresence
    )
    .on(
      "presence",
      {
        event:"leave"
      },
      handlePresenceLeave
    )
    .on(
      "broadcast",
      {
        event:"position"
      },
      payload=>{
        const d=payload.payload;

        if(!d || d.id===playerId)
          return;

        const remote=
          createRemotePlayer(
            d.id,
            d
          );

        remote.position.x=d.x;
        remote.position.y=d.y;
        remote.position.z=d.z;

        remote.rotation.y=
          d.rotation || 0;
      }
    )
    .on(
      "broadcast",
      {
        event:"chat"
      },
      payload=>{

        const d=payload.payload;

        if(d){
          addChat(
            d.name,
            d.message
          );
        }
      }
    );

  channel.subscribe(
    async status=>{

      if(status==="SUBSCRIBED"){

        await channel.track({
          id:playerId,
          name:playerName,
          district:playerDistrict,
          x:player.position.x,
          y:player.position.y,
          z:player.position.z,
          rotation:player.rotation.y
        });

      }
    }
  );
}

/* =========================
   PRESENCE
========================= */

function handlePresence(){

  const state=
    channel.presenceState();

  const active={};

  Object.keys(state).forEach(key=>{

    if(key===playerId)
      return;

    const item=
      state[key] &&
      state[key][0];

    if(!item)
      return;

    active[key]=true;

    createRemotePlayer(
      key,
      item
    );
  });

  Object.keys(remotePlayers)
    .forEach(id=>{

      if(!active[id]){

        scene.remove(
          remotePlayers[id]
        );

        delete remotePlayers[id];
      }
    });

  updateOnline();
}

function handlePresenceLeave(){

  handlePresence();
}

function updateOnline(){

  const count=
    Object.keys(remotePlayers).length+1;

  document.getElementById("online")
    .textContent=count;
}

/* =========================
   POSITION BROADCAST
========================= */

let lastBroadcast=0;

function broadcastPosition(){

  if(!channel || !player)
    return;

  const now=performance.now();

  if(now-lastBroadcast<70)
    return;

  lastBroadcast=now;

  channel.send({
    type:"broadcast",
    event:"position",
    payload:{
      id:playerId,
      name:playerName,
      district:playerDistrict,
      x:player.position.x,
      y:player.position.y,
      z:player.position.z,
      rotation:player.rotation.y
    }
  });
}

/* =========================
   MOVEMENT
========================= */

window.addEventListener(
  "keydown",
  e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift")
      running=true;

    if(e.key===" "){
      jump();
      e.preventDefault();
    }
  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift")
      running=false;
  }
);

function updateMovement(delta){

  if(!player)
    return;

  let forward=0;
  let side=0;

  if(
    keys["w"] ||
    keys["arrowup"]
  )
    forward+=1;

  if(
    keys["s"] ||
    keys["arrowdown"]
  )
    forward-=1;

  if(
    keys["a"] ||
    keys["arrowleft"]
  )
    side-=1;

  if(
    keys["d"] ||
    keys["arrowright"]
  )
    side+=1;

  forward+=joystick.y;
  side+=joystick.x;

  const length=
    Math.sqrt(
      forward*forward+
      side*side
    );

  if(length>1){

    forward/=length;
    side/=length;
  }

  const speed=
    running ? 17 : 9;

  player.position.x+=
    side*speed*delta;

  player.position.z+=
    -forward*speed*delta;

  if(length>.05){

    player.rotation.y=
      Math.atan2(
        side,
        -forward
      );
  }

  /* Gravity */

  velocityY-=28*delta;

  player.position.y+=
    velocityY*delta;

  if(player.position.y<=0){

    player.position.y=0;
    velocityY=0;
    onGround=true;
  }

  /* World boundary */

  const limit=420;

  player.position.x=
    Math.max(
      -limit,
      Math.min(
        limit,
        player.position.x
      )
    );

  player.position.z=
    Math.max(
      -limit,
      Math.min(
        limit,
        player.position.z
      )
    );

  broadcastPosition();
}

/* =========================
   JUMP
========================= */

function jump(){

  if(onGround){

    velocityY=11;
    onGround=false;
  }
}

/* =========================
   JOYSTICK
========================= */

const joystickBase=
  document.getElementById("joystick");

const stick=
  document.getElementById("stick");

let joystickActive=false;

function joystickMove(clientX,clientY){

  const rect=
    joystickBase.getBoundingClientRect();

  const cx=
    rect.left+rect.width/2;

  const cy=
    rect.top+rect.height/2;

  let dx=clientX-cx;
  let dy=clientY-cy;

  const max=45;

  const dist=
    Math.sqrt(dx*dx+dy*dy);

  if(dist>max){

    dx=dx/dist*max;
    dy=dy/dist*max;
  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  joystick.x=
    dx/max;

  joystick.y=
    dy/max*-1;
}

function joystickEnd(){

  joystickActive=false;

  joystick.x=0;
  joystick.y=0;

  stick.style.transform=
    "translate(0,0)";
}

joystickBase.addEventListener(
  "pointerdown",
  e=>{
    joystickActive=true;
    joystickMove(
      e.clientX,
      e.clientY
    );
  }
);

window.addEventListener(
  "pointermove",
  e=>{
    if(joystickActive)
      joystickMove(
        e.clientX,
        e.clientY
      );
  }
);

window.addEventListener(
  "pointerup",
  joystickEnd
);

/* =========================
   BUTTONS
========================= */

document.getElementById("jump")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      jump();
    }
  );

const runButton=
  document.getElementById("run");

runButton.addEventListener(
  "pointerdown",
  ()=>{
    running=true;
  }
);

runButton.addEventListener(
  "pointerup",
  ()=>{
    running=false;
  }
);

runButton.addEventListener(
  "pointercancel",
  ()=>{
    running=false;
  }
);

/* =========================
   CHAT
========================= */

document.getElementById("chatForm")
  .addEventListener(
    "submit",
    async e=>{

      e.preventDefault();

      const input=
        document.getElementById(
          "chatInput"
        );

      const message=
        input.value.trim();

      if(!message)
        return;

      addChat(
        playerName,
        message
      );

      if(channel){

        await channel.send({
          type:"broadcast",
          event:"chat",
          payload:{
            name:playerName,
            message
          }
        });
      }

      input.value="";
    }
  );

function addChat(name,message){

  const chat=
    document.getElementById("chat");

  const div=
    document.createElement("div");

  div.className="msg";

  div.textContent=
    name+": "+message;

  chat.appendChild(div);

  while(chat.children.length>8)
    chat.removeChild(
      chat.firstChild
    );

  setTimeout(()=>{
    if(div.parentNode)
      div.remove();
  },10000);
}

/* =========================
   CAMERA
========================= */

function updateCamera(){

  if(!player)
    return;

  const target=
    new THREE.Vector3(
      player.position.x,
      player.position.y+4,
      player.position.z
    );

  const offset=
    new THREE.Vector3(
      0,
      8,
      15
    );

  offset.applyAxisAngle(
    new THREE.Vector3(0,1,0),
    player.rotation.y
  );

  const desired=
    target.clone().add(offset);

  camera.position.lerp(
    desired,
    .12
  );

  camera.lookAt(target);
}

/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(animate);

  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );

  updateMovement(delta);
  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

/* =========================
   RESIZE
========================= */

function resize(){

  if(!camera || !renderer)
    return;

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
}

/* =========================
   RESTORE LOGIN
========================= */

document.getElementById("name").value=
  localStorage.getItem(
    "kerala_name"
  ) || "";

document.getElementById("district").value=
  localStorage.getItem(
    "kerala_district"
  ) || "Ernakulam";
